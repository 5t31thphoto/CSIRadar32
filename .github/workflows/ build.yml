name: build

on:
  push:
    branches: [ "**" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  ESP32_CORE:    esp32:esp32@3.0.7
  LOVYANGFX_VER: 1.2.0
  RX_SKETCH:   CSI-Radar-S3
  RX_FQBN:     esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=default_16MB,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default
  RX_CHIP:     esp32s3
  RX_FLASHSZ:  16MB
  BEACON_SKETCH: CSI-Beacon-Extended

jobs:
  build-receiver:
    name: Build receiver (T-Display-S3)
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with: { version: 1.0.4 }
      - name: Configure Arduino CLI
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install ${{ env.ESP32_CORE }}
      - name: Install LovyanGFX
        run: arduino-cli lib install "LovyanGFX@${{ env.LOVYANGFX_VER }}"
      - name: Install esptool
        run: python3 -m pip install --upgrade esptool
      - name: Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Prep receiver sketch directory
        run: |
          # Arduino requires the .ino filename to match its parent
          # directory name.  Zip-unpacker flattened everything into the
          # repo root, so create the expected sketch folder on-the-fly
          # and move receiver sources into it.  Only affects the
