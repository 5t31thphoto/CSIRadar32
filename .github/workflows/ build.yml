name: build

on:
  push:
    branches: [ "**" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  ESP32_CORE:    esp32:esp32@3.0.7
  LOVYANGFX_VER: 1.2.0
  RX_SKETCH:   CSI-Radar-S3
  RX_FQBN:     esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=default_16MB,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default
  RX_CHIP:     esp32s3
  RX_FLASHSZ:  16MB
  BEACON_SKETCH: CSI-Beacon-Extended

jobs:
  build-receiver:
    name: Build receiver (T-Display-S3)
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with: { version: 1.0.4 }
      - name: Configure Arduino CLI
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install ${{ env.ESP32_CORE }}
      - name: Install LovyanGFX
        run: arduino-cli lib install "LovyanGFX@${{ env.LOVYANGFX_VER }}"
      - name: Install esptool
        run: python3 -m pip install --upgrade esptool
      - name: Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Compile
        run: |
          mkdir -p build/rx
          arduino-cli compile --fqbn "${{ env.RX_FQBN }}" --output-dir build/rx --warnings default --verbose "${{ env.RX_SKETCH }}"
      - name: Merge
        run: |
          cd build/rx
          BOOT="${{ env.RX_SKETCH }}.ino.bootloader.bin"
          PART="${{ env.RX_SKETCH }}.ino.partitions.bin"
          APP="${{ env.RX_SKETCH }}.ino.bin"
          OTA_ARG=""
          BOOT_APP0=$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin -print -quit 2>/dev/null || true)
          if [ -n "$BOOT_APP0" ] && grep -q "otadata" "${{ env.RX_SKETCH }}.ino.partitions.csv" 2>/dev/null; then
            OTA_ARG="0xe000 $BOOT_APP0"
          fi
          esptool.py --chip ${{ env.RX_CHIP }} merge_bin -o csi-radar-s3-merged.bin --flash_mode qio --flash_size ${{ env.RX_FLASHSZ }} 0x0 "$BOOT" 0x8000 "$PART" $OTA_ARG 0x10000 "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-merged
          path: build/rx/csi-radar-s3-merged.bin
          retention-days: 30

  build-beacon:
    name: Build beacon ${{ matrix.chip }} id ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id: [1, 2, 3]
        include:
          - chip: c3
            chip_family: esp32c3
            fqbn: esp32:esp32:XIAO_ESP32C3:CDCOnBoot=default,PartitionScheme=huge_app,CPUFreq=160,FlashMode=qio,FlashFreq=80,FlashSize=4M,DebugLevel=none,EraseFlash=none
            flashsz: 4MB
          - chip: s3
            chip_family: esp32s3
            fqbn: esp32:esp32:XIAO_ESP32S3:USBMode=default,CDCOnBoot=cdc,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=huge_app,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default
            flashsz: 8MB
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with: { version: 1.0.4 }
      - name: Configure Arduino CLI
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install ${{ env.ESP32_CORE }}
      - name: Install esptool
        run: python3 -m pip install --upgrade esptool
      - name: Compile beacon
        run: |
          mkdir -p build/beacon
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --output-dir build/beacon --warnings default --build-property "compiler.cpp.extra_flags=-DBEACON_ID_DEFAULT=${{ matrix.id }}" --verbose "${{ env.BEACON_SKETCH }}"
      - name: Merge
        run: |
          cd build/beacon
          BOOT="${{ env.BEACON_SKETCH }}.ino.bootloader.bin"
          PART="${{ env.BEACON_SKETCH }}.ino.partitions.bin"
          APP="${{ env.BEACON_SKETCH }}.ino.bin"
          OUT="csi-beacon-${{ matrix.chip }}-id${{ matrix.id }}-merged.bin"
          esptool.py --chip ${{ matrix.chip_family }} merge_bin -o "$OUT" --flash_mode qio --flash_size ${{ matrix.flashsz }} 0x0 "$BOOT" 0x8000 "$PART" 0x10000 "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.chip }}-id${{ matrix.id }}-merged
          path: build/beacon/csi-beacon-${{ matrix.chip }}-id${{ matrix.id }}-merged.bin
          retention-days: 30

  build-pages:
    name: Assemble web flasher
    needs: [build-receiver, build-beacon]
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ needs.build-receiver.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: receiver-merged
          path: dl/receiver
      - uses: actions/download-artifact@v4
        with:
          pattern: beacon-*-merged
          path: dl/beacons
          merge-multiple: true
      - name: Assemble site
        run: |
          set -e
          mkdir -p site
          cp -r docs/. site/
          mkdir -p site/bins
          cp dl/receiver/csi-radar-s3-merged.bin site/bins/
          cp dl/beacons/csi-beacon-*-merged.bin site/bins/
          python3 -m pip install --quiet 'qrcode[pil]'
          python3 - <<'PY'
          import qrcode, qrcode.image.svg
          url = "https://5t31thphoto.github.io/CSIRadar32/"
          qr = qrcode.QRCode(version=None, error_correction=qrcode.constants.ERROR_CORRECT_M, box_size=10, border=4)
          qr.add_data(url)
          qr.make(fit=True)
          img = qr.make_image(image_factory=qrcode.image.svg.SvgPathImage, fill_color="#050510", back_color="#ffffff")
          img.save("site/qr.svg")
          PY
          SHORT_SHA="${{ needs.build-receiver.outputs.short_sha }}"
          BUILD_DATE=$(date -u +%Y-%m-%d)
          sed -i "s|{{SHORT_SHA}}|${SHORT_SHA}|g" site/index.html
          sed -i "s|{{BUILD_DATE}}|${BUILD_DATE}|g" site/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy to Pages
    needs: build-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
