name: build
on:
  push:
    branches:
    - '**'
    tags:
    - v*
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
env:
  ESP32_CORE: esp32:esp32@3.0.7
  LOVYANGFX_VER: 1.2.0
  RX_SKETCH: CSI-Radar-S3
  BEACON_SKETCH: BeaconBuild
jobs:
  apply-drop:
    name: Apply dropped zip (if any)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      applied: ${{ steps.result.outputs.applied }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Look for a dropped zip
      id: find
      run: |
        shopt -s nullglob
        zips=(*.zip)
        if [ ${#zips[@]} -eq 0 ]; then
          echo "none found"
          echo "zip=" >> "$GITHUB_OUTPUT"
        elif [ ${#zips[@]} -gt 1 ]; then
          echo "::error::More than one .zip in the repo root: ${zips[*]}"
          echo "::error::Leave exactly one so it is unambiguous which to apply."
          exit 1
        else
          echo "found: ${zips[0]}"
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
        fi

    - name: Unpack over the working tree
      if: steps.find.outputs.zip != ''
      run: |
        set -euo pipefail
        ZIP="${{ steps.find.outputs.zip }}"
        TMP=$(mktemp -d)
        unzip -q "$ZIP" -d "$TMP/x"

        # Zips exported from a folder usually have a single wrapper
        # directory (CSIRadar32-main/).  Use its CONTENTS, not the
        # folder itself, or everything lands one level too deep.
        SRC="$TMP/x"
        if [ "$(ls -A "$SRC" | wc -l)" -eq 1 ]; then
          only="$(ls -A "$SRC")"
          if [ -d "$SRC/$only" ]; then
            echo "unwrapping top-level folder: $only/"
            SRC="$SRC/$only"
          fi
        fi

        # Never let a zip overwrite git internals.
        rm -rf "$SRC/.git"

        # GITHUB_TOKEN CANNOT create or update files under
        # .github/workflows -- GitHub blocks it at the push, and there is
        # no `workflows` scope that can be added to the permissions block
        # to allow it.  Only a PAT with `workflow` scope can.  So the
        # overlay skips them; anything else in .github still applies.
        #
        # This is NOT silent: if the zip carries workflow changes they are
        # reported here so they can be applied by hand.  A dropped-in
        # workflow change that vanished without a word would be worse than
        # the failed push.
        if [ -d "$SRC/.github/workflows" ]; then
          if ! diff -rq "$SRC/.github/workflows" ".github/workflows" >/dev/null 2>&1; then
            echo "::warning::Zip contains workflow changes. They were NOT applied -- GITHUB_TOKEN cannot update .github/workflows. Apply that directory manually."
            echo "--- workflow differences (not applied) ---"
            diff -rq "$SRC/.github/workflows" ".github/workflows" || true
          else
            echo "workflow files identical - nothing to apply"
          fi
          rm -rf "$SRC/.github/workflows"
        fi

        echo "applying $(find "$SRC" -type f | wc -l) files"
        # -a preserves modes and copies dotfiles; trailing /. means
        # "contents of", so this overlays instead of nesting.
        cp -a "$SRC"/. .

        rm -f "$ZIP"
        echo "removed $ZIP so it does not re-apply next push"

    - name: Commit the result
      id: result
      run: |
        set -euo pipefail
        if [ -z "${{ steps.find.outputs.zip }}" ]; then
          echo "applied=false" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "zip contents identical to repo; nothing to commit"
          echo "applied=false" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -q -m "Apply ${{ steps.find.outputs.zip }} [drop-in]"
        git push origin HEAD:"${GITHUB_REF_NAME}"
        NEW=$(git rev-parse HEAD)
        echo "applied=true" >> "$GITHUB_OUTPUT"
        echo "sha=${NEW}"   >> "$GITHUB_OUTPUT"
        echo "committed ${NEW}"

    - name: Summary
      run: |
        echo "### Drop-in updater" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.result.outputs.applied }}" = "true" ]; then
          echo "Applied \`${{ steps.find.outputs.zip }}\` and committed \`${{ steps.result.outputs.sha }}\`." >> $GITHUB_STEP_SUMMARY
          echo "Build jobs below compile that commit." >> $GITHUB_STEP_SUMMARY
        else
          echo "No zip found. Normal build of \`${{ steps.result.outputs.sha }}\`." >> $GITHUB_STEP_SUMMARY
        fi

  preflight:
    name: Pre-flight (compile every firmware, no toolchain)
    needs: apply-drop
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - name: Compile every sketch as Arduino builds it
      run: |
        set -euo pipefail



        ./tools/preflight.sh

    - name: Probe opcodes match the T-Display
      run: |
        set -euo pipefail
        g++ -std=c++17 -fsyntax-only -I . -I tools/hostshim tools/opcode_check.cpp

  build-receiver:
    name: Build receiver (T-Display-S3)
    needs:
    - apply-drop
    - preflight
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - uses: arduino/setup-arduino-cli@v2
    - name: Install ESP32 core
      run: |
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install ${{ env.ESP32_CORE }}

    - name: Install LovyanGFX
      run: arduino-cli lib install "LovyanGFX@${{ env.LOVYANGFX_VER }}"
    - name: Cache Rust toolchain and build
      uses: actions/cache@v4
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          rust/rfcore/target

          '
        key: xtensa-${{ runner.os }}-${{ hashFiles('rust/rfcore/Cargo.toml') }}-${{ hashFiles('rust/rfcore/src/lib.rs') }}
        restore-keys: 'xtensa-${{ runner.os }}-${{ hashFiles(''rust/rfcore/Cargo.toml'') }}-

          xtensa-${{ runner.os }}-

          '
    - name: Install Rust Xtensa toolchain
      uses: esp-rs/xtensa-toolchain@v1.6
      with:
        # Verified against esp-rs/rust-build releases: 1.96.0.0 exists.
        version: 1.96.0.0
        default: true
        buildtargets: esp32s3
        # ldproxy is the linker shim for ESP-IDF *std* builds.  This crate
        # is #![no_std] and links as a staticlib into the Arduino build,
        # so ldproxy is never invoked -- installing it is one more network
        # download that can fail for something we do not use.
        ldproxy: false
    - name: Verify Rust Xtensa toolchain
      run: |
        set -euo pipefail
        rustup toolchain list
        rustc +esp --version --verbose
        cargo +esp --version --verbose
        rustc +esp --print target-list | grep -Fx xtensa-esp32s3-none-elf
        # Listing the target is NOT the same as having its core.  The
        # observed failure passed this check and then failed to build,
        # so prove the standard library is actually present.
        SYSROOT=$(rustc +esp --print sysroot)
        ls "$SYSROOT/lib/rustlib/xtensa-esp32s3-none-elf/lib/" | head -5 \
          || { echo "::error::xtensa-esp32s3-none-elf core is not installed"; exit 1; }

    - name: Build Rust RF inference core
      run: |
        set -euo pipefail
        cargo +esp build --release --target xtensa-esp32s3-none-elf --manifest-path rust/rfcore/Cargo.toml
        test -s rust/rfcore/target/xtensa-esp32s3-none-elf/release/libmantis_rfcore.a
        ar t rust/rfcore/target/xtensa-esp32s3-none-elf/release/libmantis_rfcore.a | grep -q .

    - name: Short SHA
      id: sha
      run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    - name: Prep receiver sketch directory
      run: |
        if [ -f "CSI-Radar-S3.ino" ] && [ ! -d "CSI-Radar-S3" ]; then
          mkdir -p CSI-Radar-S3
          shopt -s nullglob
          for f in *.ino *.h *.cpp; do
            [ -f "$f" ] && mv "$f" CSI-Radar-S3/
          done
        fi
        ls CSI-Radar-S3/

    - name: Compile
      run: |
        set -o pipefail
        mkdir -p build/rx
        arduino-cli compile \
          --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashMode=qio,CDCOnBoot=cdc \
          --build-property "compiler.optimization_flags=-O2" \
          --build-property "compiler.cpp.extra_flags=-I${{ github.workspace }}/rust/rfcore" \
          --build-property "compiler.c.extra_flags=-I${{ github.workspace }}/rust/rfcore" \
          --build-property "compiler.c.elf.extra_flags=-L${{ github.workspace }}/rust/rfcore/target/xtensa-esp32s3-none-elf/release -Wl,--whole-archive -l:libmantis_rfcore.a -Wl,--no-whole-archive" \
          --output-dir build/rx \
          "${{ env.RX_SKETCH }}" 2>&1 | tee build/compile.log

    - name: Check DRAM headroom
      run: |
        set -o pipefail
        LINE=$(grep -i "Global variables use" build/compile.log | head -1 || true)
        echo "$LINE"
        USED=$(echo "$LINE" | grep -oE 'use [0-9]+' | grep -oE '[0-9]+' | head -1)
        FREE=$(echo "$LINE" | grep -oE 'leaving [0-9]+' | grep -oE '[0-9]+' | head -1)
        if [ -z "${FREE:-}" ]; then
          # A changed log format is not a broken firmware.  Say so
          # loudly and carry on -- failing here would block a build
          # that compiles and runs perfectly well.
          echo "::warning::could not parse DRAM figures - headroom unverified"
          exit 0
        fi
        echo "globals ${USED:-?} B, ${FREE} B left for local variables"
        # The sprite alone needs 170*320*2 = 108800 B from that pool.
        if [ "$FREE" -lt 120000 ]; then
          echo "::error::Only ${FREE} B of DRAM left; the 108800 B display"
          echo "::error::sprite cannot fit. UI would fall back to direct-draw."
          exit 1
        fi
        if [ "$FREE" -lt 140000 ]; then
          echo "::warning::DRAM headroom is thin (${FREE} B). Sprite needs 108800 B."
        fi

    - name: Verify the REAL Rust core is linked
      run: |
        set -euo pipefail
        ELF="build/rx/${{ env.RX_SKETCH }}.ino.elf"
        test -f "$ELF"
        # Look in every plausible place before concluding nm is absent.
        # Failing the build because a TOOL moved would break a build
        # that is otherwise perfectly good -- the gate must fire on a
        # stub, not on its own fragility.
        NM=""
        for cand in \
          $(find ~/.arduino15 -name 'xtensa-esp32s3-elf-nm' -type f 2>/dev/null) \
          $(find ~/.arduino15 -name 'xtensa-esp32-elf-nm'   -type f 2>/dev/null) \
          $(command -v xtensa-esp32s3-elf-nm 2>/dev/null) \
          $(command -v llvm-nm 2>/dev/null) \
          $(command -v nm 2>/dev/null); do
          [ -x "$cand" ] && { NM="$cand"; break; }
        done
        if [ -z "$NM" ]; then
          echo "::warning::no nm found anywhere - cannot verify the Rust core"
          echo "::warning::the build is otherwise complete; verify on hardware"
          exit 0
        fi
        echo "using nm: $NM"
        # NOTE: no strtonum().  ubuntu-latest ships mawk as the default
        # awk and strtonum() is a GAWK extension -- it would abort this
        # step with "function strtonum never defined".  Pull the hex
        # field out with awk and convert in the shell instead.
        SZ_HEX=$("$NM" -S "$ELF" | awk '$4 == "mantis_rf_observe" { print $2; exit }')
        SZ=$((16#${SZ_HEX:-0}))
        echo "mantis_rf_observe = ${SZ} bytes (0x${SZ_HEX:-0})"
        if [ "$SZ" -lt 64 ]; then
          echo "::error::WEAK FALLBACK linked, not the Rust core."
          echo "::error::mantis_rf_observe is ${SZ} bytes - that is a stub."
          exit 1
        fi
        echo "real Rust core linked"

    - name: Merge into single .bin
      run: |
        pip install esptool==4.8.1
        BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
        cd build/rx
        python -m esptool --chip esp32s3 merge_bin \
          -o csi-radar-s3-merged.bin \
          --flash_mode keep --flash_freq keep --flash_size keep \
          0x0     ${{ env.RX_SKETCH }}.ino.bootloader.bin \
          0x8000  ${{ env.RX_SKETCH }}.ino.partitions.bin \
          0xe000  "$BOOT_APP0" \
          0x10000 ${{ env.RX_SKETCH }}.ino.bin

    - uses: actions/upload-artifact@v4
      with:
        name: receiver-merged
        path: build/rx/csi-radar-s3-merged.bin
        retention-days: 30
  build-cardputer:
    needs:
    - apply-drop
    - preflight
    runs-on: ubuntu-latest
    env:
      CP_SKETCH: Mantis-Cardputer-Adv
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - uses: arduino/setup-arduino-cli@v2
    - name: Install ESP32 + M5Stack cores
      run: |
        set -euo pipefail
        arduino-cli config init --overwrite
        arduino-cli config add board_manager.additional_urls \
          https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli config add board_manager.additional_urls \
          https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
        arduino-cli core update-index
        # Vendor docs require M5Stack board manager >= 3.2.3 for the ADV.
        # RETRY THE CORE INSTALL.
        #
        # Observed failure: "tls: failed to verify certificate: x509:
        # certificate is not valid for any names, but wanted to match
        # github.com" while fetching esp32-3.0.7.zip.  That is a CDN
        # or proxy problem between the runner and GitHub, not anything
        # in this repo, and it clears on a retry.
        for attempt in 1 2 3 4; do
          if arduino-cli core install esp32:esp32@3.0.7; then break; fi
          if [ "$attempt" = "4" ]; then
            echo "::error::esp32 core install failed after 4 attempts"; exit 1; fi
          echo "::warning::esp32 core install attempt $attempt failed; retrying"
          arduino-cli cache clean || true
          arduino-cli core update-index
          sleep 20
        done

        # M5STACK CORE INSTALL, WITH RETRIES.
        #
        # Observed failure:
        #   "fetched archive size differs from size specified in index:
        #    20452175 != 20447892"
        #
        # That is the VENDOR'S index disagreeing with the vendor's own
        # 20 MB archive.  Nothing we control, and a pinned version has
        # no way around it -- so refresh the index and retry, then fall
        # back to whatever the index currently agrees with rather than
        # failing the build on an upstream checksum.
        # LATEST FIRST, pinned version as the fallback.
        #
        # The pinned 3.2.3 archive is what hit "fetched archive size
        # differs from size specified in index" -- a bad entry in the
        # vendor's index for that specific release.  The unpinned
        # install fetched 3.3.9 without trouble in the same run.
        #
        # The ADV needs >= 3.2.3, and latest satisfies that, so taking
        # latest is both more likely to work and still correct.  The
        # floor check below is what actually enforces the requirement.
        ok=0
        for attempt in 1 2 3; do
          if arduino-cli core install m5stack:esp32; then ok=1; break; fi
          echo "::warning::m5stack install attempt $attempt failed; refreshing index"
          arduino-cli cache clean || true
          arduino-cli core update-index
          sleep 10
        done
        if [ "$ok" -eq 0 ]; then
          echo "::warning::latest unavailable; trying the pinned 3.2.3"
          arduino-cli core install m5stack:esp32@3.2.3
        fi
        VER=$(arduino-cli core list | awk '/m5stack:esp32/{print $2}')
        echo "m5stack core version: $VER"
        # The ADV needs >= 3.2.3.  A silent downgrade would compile and
        # then misbehave on hardware, so refuse it here.
        if [ -z "$VER" ]; then echo "::error::m5stack core did not install"; exit 1; fi
        MAJOR=${VER%%.*}; REST=${VER#*.}; MINOR=${REST%%.*}
        if [ "$MAJOR" -lt 3 ] || { [ "$MAJOR" -eq 3 ] && [ "$MINOR" -lt 2 ]; }; then
          echo "::error::m5stack core $VER is older than the 3.2.3 the ADV requires"; exit 1
        fi

    - name: Install M5 libraries
      run: |
        set -euo pipefail





        arduino-cli lib install "M5Cardputer@1.1.1"
        arduino-cli lib install "M5Unified@0.2.10"
        arduino-cli lib install "M5GFX@0.2.10"




        arduino-cli lib install "ESP8266Audio@1.9.7"
        # ESP8266Audio ships two files that do not build on ESP32 core 3.x:
        # the HTTP and ICY stream sources use WiFiClient, which core 3.x moved
        # out of the header they include. Nothing here uses them, but
        # arduino-cli compiles every .cpp in a library, so the build dies on
        # code we never call. We decode MP3 from a local SD file.
        # (No apostrophes: these run blocks are single-quoted yaml scalars.)
        LIBDIR="$HOME/Arduino/libraries/ESP8266Audio/src"
        rm -f "$LIBDIR/AudioFileSourceHTTPStream.cpp" "$LIBDIR/AudioFileSourceHTTPStream.h"
        rm -f "$LIBDIR/AudioFileSourceICYStream.cpp" "$LIBDIR/AudioFileSourceICYStream.h"
        echo "trimmed ESP8266Audio network sources"

        arduino-cli lib list

    - name: Prep sketch directory
      run: |
        set -euo pipefail
        mkdir -p "${{ env.CP_SKETCH }}"
        # NO "|| true" ON THE COPIES.
        #
        # Swallowing a failed copy is how a sketch directory ends up
        # missing a header and fails hundreds of lines later with
        # "not declared in this scope" -- which reads as a code bug
        # and is a packaging bug.  If a file that should exist does
        # not, fail here, where the message is the truth.
        cp cardputer/*.h "${{ env.CP_SKETCH }}/"
        cp cardputer/Mantis-Cardputer-Adv.ino "${{ env.CP_SKETCH }}/"
        # The mesh and inference headers are shared with the receiver;
        # the Cardputer is a full receiver and uses all of them.
        cp mantis_*.h "${{ env.CP_SKETCH }}/"
        mv "${{ env.CP_SKETCH }}/Mantis-Cardputer-Adv.ino" \
           "${{ env.CP_SKETCH }}/${{ env.CP_SKETCH }}.ino" 2>/dev/null || true
        ls -la "${{ env.CP_SKETCH }}"

    - name: Compile
      run: |
        set -o pipefail
        mkdir -p build/cardputer
        # Board defaults, for the same reason as the Core2: the
        # m5stack_cardputer definition already knows its flash size
        # and partition layout, and an override I cannot verify is
        # just another way to fail.
        # Cardputer PSRAM: DELIBERATELY NOT FORCED.
        #
        # On S3 the PSRAM menu also sets build.psram_type and
        # build.memory_type={build.boot}_{build.psram_type}, which changes the
        # bootloader image -- not just a define. Forcing a value on a board
        # whose StampS3 variant may not have PSRAM would produce firmware that
        # will not boot.
        #
        # The board definition knows its own variant. We print what it resolves
        # to so it is on the record rather than assumed.
        arduino-cli board details --fqbn m5stack:esp32:m5stack_cardputer | sed -n "/PSRAM/,+4p;1,12p" || true
        arduino-cli compile \
          --fqbn m5stack:esp32:m5stack_cardputer \
          --output-dir build/cardputer \
          "${{ env.CP_SKETCH }}" 2>&1 | tee build/cp_compile.log

    - name: Make BOTH binaries
      run: |
        set -euo pipefail
        pip install esptool==4.8.1
        cd build/cardputer
        BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)

        # 1. MERGED -- for the web flasher, written at offset 0.
        python -m esptool --chip esp32s3 merge_bin \
          -o mantis-cardputer-adv-merged.bin \
          --flash_mode keep --flash_freq keep --flash_size keep \
          0x0     "${{ env.CP_SKETCH }}.ino.bootloader.bin" \
          0x8000  "${{ env.CP_SKETCH }}.ino.partitions.bin" \
          0xe000  "$BOOT_APP0" \
          0x10000 "${{ env.CP_SKETCH }}.ino.bin"

        # 2. APP-ONLY -- the bare application image.
        # M5Launcher accepts this form as well (the charge-mode app for
        # this board ships exactly this way), and it is a much smaller
        # SD download.  Offered as an alternative, not a requirement.
        cp "${{ env.CP_SKETCH }}.ino.bin" mantis-cardputer-adv-app.bin

        M=$(stat -c%s mantis-cardputer-adv-merged.bin)
        A=$(stat -c%s mantis-cardputer-adv-app.bin)
        echo "merged $M B   app-only $A B"

        # TRUNCATION IS THE PROPERTY THAT MATTERS FOR THE LAUNCHER.
        # A merged image padded to the full 8 MB flash would still
        # flash correctly over USB but would be a 8 MB file to copy to
        # an SD card and to parse.  Our receiver image is 1.15 MB on an
        # 8 MB flash, so merge_bin is not padding -- assert it stays
        # that way rather than trusting it.
        if [ "$M" -gt 4194304 ]; then
          echo "::error::merged bin is ${M} B - looks padded to flash size."
          echo "::error::M5Launcher wants a TRUNCATED merged image."
          exit 1
        fi
        if [ "$A" -ge "$M" ]; then
          echo "::error::app-only bin is not smaller than merged - wrong file"
          exit 1
        fi
        # Both must carry the ESP image magic 0xE9 as their first byte.
        for f in mantis-cardputer-adv-merged.bin mantis-cardputer-adv-app.bin; do
          HDR=$(od -An -tx1 -N1 "$f" | tr -d ' \n')
          if [ "$HDR" != "e9" ]; then
            echo "::error::$f has no ESP image magic (got 0x$HDR)"
            exit 1
          fi
        done

    - uses: actions/upload-artifact@v4
      with:
        name: cardputer
        path: build/cardputer/mantis-cardputer-adv-*.bin
  build-core2:
    needs:
    - apply-drop
    - preflight
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - uses: arduino/setup-arduino-cli@v2
    - name: Install ESP32 core
      run: |
        set -euo pipefail
        arduino-cli config init --overwrite
        arduino-cli config add board_manager.additional_urls \
          https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core update-index
        # RETRY THE CORE INSTALL.
        #
        # Observed failure: "tls: failed to verify certificate: x509:
        # certificate is not valid for any names, but wanted to match
        # github.com" while fetching esp32-3.0.7.zip.  That is a CDN
        # or proxy problem between the runner and GitHub, not anything
        # in this repo, and it clears on a retry.
        for attempt in 1 2 3 4; do
          if arduino-cli core install esp32:esp32@3.0.7; then break; fi
          if [ "$attempt" = "4" ]; then
            echo "::error::esp32 core install failed after 4 attempts"; exit 1; fi
          echo "::warning::esp32 core install attempt $attempt failed; retrying"
          arduino-cli cache clean || true
          arduino-cli core update-index
          sleep 20
        done

    - name: Install M5 libraries
      run: |
        set -euo pipefail
        arduino-cli lib install "M5Unified"
        arduino-cli lib install "M5GFX"


        arduino-cli lib install "ESP8266Audio@1.9.7"
        # ESP8266Audio ships two files that do not build on ESP32 core 3.x:
        # the HTTP and ICY stream sources use WiFiClient, which core 3.x moved
        # out of the header they include. Nothing here uses them, but
        # arduino-cli compiles every .cpp in a library, so the build dies on
        # code we never call. We decode MP3 from a local SD file.
        # (No apostrophes: these run blocks are single-quoted yaml scalars.)
        LIBDIR="$HOME/Arduino/libraries/ESP8266Audio/src"
        rm -f "$LIBDIR/AudioFileSourceHTTPStream.cpp" "$LIBDIR/AudioFileSourceHTTPStream.h"
        rm -f "$LIBDIR/AudioFileSourceICYStream.cpp" "$LIBDIR/AudioFileSourceICYStream.h"
        echo "trimmed ESP8266Audio network sources"

        arduino-cli lib list

    - name: Prep sketch
      run: |
        set -euo pipefail
        mkdir -p Core2Build
        cp core2/Mantis-Core2.ino Core2Build/Core2Build.ino
        cp core2/*.h Core2Build/





        cp mantis_*.h Core2Build/
        ls -la Core2Build

    - name: Compile
      run: |
        set -o pipefail
        mkdir -p build/core2
        # NO BUILD-PROPERTY OVERRIDES.
        #
        # The m5stack_core2 board definition already sets 16 MB flash,
        # the right partition scheme and PSRAM.  Overriding those with
        # values I could not verify only creates ways for the build to
        # fail -- a partition name that is not a real .csv fails the
        # link, and forcing BOARD_HAS_PSRAM through extra_flags sets
        # the macro without enabling the PSRAM the board init needs.
        #
        # The board defaults are correct.  Use them.
        arduino-cli board details --fqbn esp32:esp32:m5stack_core2 | sed -n "/PSRAM/,+3p;1,12p" || true
        arduino-cli compile \
        # PSRAM=enabled IS EXPLICIT AND MUST STAY THAT WAY.
        #
        # From arduino-esp32 boards.txt:
        #   m5stack-core2.build.defines=            (empty)
        #   ...menu.PSRAM.enabled.build.defines=
        #       -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
        #
        # Enabling PSRAM on ESP32 classic needs BOTH flags. The second is the
        # silicon cache-bug workaround, and a build with the define but without
        # the workaround gets subtle memory corruption instead of a clean
        # failure -- exactly what a --build-property override of
        # -DBOARD_HAS_PSRAM alone would have produced.
        #
        # Going through the board MENU applies both together, the way the board
        # definition intends. Never set BOARD_HAS_PSRAM by hand here.

          --fqbn esp32:esp32:m5stack_core2:PSRAM=enabled \
          --output-dir build/core2 \
          Core2Build 2>&1 | tee build/core2_compile.log

    - name: Package both binaries
      run: |
        set -euo pipefail
        pip install esptool==4.8.1
        cd build/core2
        BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
        python -m esptool --chip esp32 merge_bin \
          -o mantis-core2-merged.bin \
          --flash_mode keep --flash_freq keep --flash_size keep \
          0x1000  Core2Build.ino.bootloader.bin \
          0x8000  Core2Build.ino.partitions.bin \
          0xe000  "$BOOT_APP0" \
          0x10000 Core2Build.ino.bin
        # App-only image, for M5Launcher from SD.
        cp Core2Build.ino.bin mantis-core2-app.bin
        M=$(stat -c%s mantis-core2-merged.bin); A=$(stat -c%s mantis-core2-app.bin)
        echo "merged $M B   app $A B"
        # Truncated, not padded: a 16 MB file would be miserable on an
        # SD card and slow for the launcher to parse.
        if [ "$M" -gt 8388608 ]; then
          echo "::error::merged bin is ${M} B - looks padded to flash size"; exit 1; fi
        if [ "$A" -ge "$M" ]; then
          echo "::error::app bin not smaller than merged - wrong file"; exit 1; fi

    - uses: actions/upload-artifact@v4
      with:
        name: core2
        path: build/core2/mantis-core2-*.bin
  build-beacon:
    name: Build smart beacon (${{ matrix.chip }})
    needs:
    - apply-drop
    - preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chip:
        - c3
        - s3
        include:
        - chip: c3
          chip_family: esp32c3
          fqbn: esp32:esp32:XIAO_ESP32C3
        - chip: s3
          chip_family: esp32s3
          fqbn: esp32:esp32:XIAO_ESP32S3
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - uses: arduino/setup-arduino-cli@v2
    - name: Install ESP32 core
      run: |
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install ${{ env.ESP32_CORE }}

    - name: Prep sketch (ONE firmware for every beacon)
      run: |
        set -euo pipefail
        # No per-device patching.  The beacon claims its id from the
        # mesh at runtime and persists it in NVS; the physical box is
        # identified permanently by a MAC-derived uid.  That removed
        # six build jobs, six artefacts and six manifests, and it
        # removed the failure mode where the wrong bin went to the
        # wrong box.
        mkdir -p BeaconBuild
        cp CSI-Beacon-Mantis/CSI-Beacon-Mantis.ino BeaconBuild/BeaconBuild.ino
        cp mantis_*.h BeaconBuild/

        # HEADER/SKETCH DRIFT GUARD.
        #
        # A drop that updates the sketch but not a header produces a
        # wall of "struct X has no member named Y" that reads like a
        # code bug and is a packaging bug.  Checked as MEMBER USE ->
        # MEMBER DECLARATION, not as a bare substring: grepping for
        # "uid" also matches mantis_uid_from_mac and uid_bind, so a
        # substring version passes happily with the field deleted.
        check_pair() {
          if grep -qE "$1" BeaconBuild/BeaconBuild.ino \
             && ! grep -qhE "$2" BeaconBuild/mantis_*.h; then
            echo "::error::sketch uses $3 but no mantis header declares it."
            echo "::error::Headers and sketch are from different versions."
            exit 1
          fi
        }
        check_pair '\.uid[^_a-zA-Z]'     'uint16_t[[:space:]]+uid;'         'MantisAirFrame::uid'
        check_pair '\.blocked_mask'      'uint8_t[[:space:]]+blocked_mask;' 'MantisPerspective::blocked_mask'
        check_pair '\.blocked[^_a-zA-Z]' 'bool[[:space:]]+blocked;'         'MantisBeaconLink::blocked'
        check_pair 'mantis_uid_from_mac'  'mantis_uid_from_mac'              'mantis_uid_from_mac()'

        # PROBE CONTROL OPCODES: COMPILED, NOT GREPPED.
        #
        # The previous check grepped config.h for literal strings with
        # exact spacing.  config.h writes three spaces where the guard
        # expected five, so it failed on WHITESPACE and broke the
        # build while every opcode was correct.  A static_assert
        # cannot care about formatting.
        # config.h includes <Arduino.h>, which a bare runner does not
        # have -- so the check needs a shim on the include path.  The
        # first version omitted it and failed with "Arduino.h: No such
        # file or directory", reported as opcode drift, which is a
        # lie: it never got far enough to compare anything.
        g++ -std=c++17 -fsyntax-only -I . -I tools/hostshim \
          tools/opcode_check.cpp \
          || { echo "::error::probe opcode/struct drift vs config.h"; exit 1; }

        # PRE-FLIGHT: compile all four firmwares the way Arduino does.
        # See tools/preflight.sh.  Seconds, no toolchain.
        ./tools/preflight.sh
        echo "sketch, headers and control opcodes agree"
        ls -la BeaconBuild

    - name: Compile beacon (chip=${{ matrix.chip }})
      run: |
        mkdir -p build/beacon
        arduino-cli compile \
          --fqbn ${{ matrix.fqbn }} \
          --output-dir build/beacon \
          "BeaconBuild"

    - name: Merge into single .bin
      run: |
        pip install esptool==4.8.1
        BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
        cd build/beacon
        OUT="csi-beacon-${{ matrix.chip }}-merged.bin"
        python -m esptool --chip ${{ matrix.chip_family }} merge_bin \
          -o "$OUT" \
          --flash_mode keep --flash_freq keep --flash_size keep \
          0x0     ${{ env.BEACON_SKETCH }}.ino.bootloader.bin \
          0x8000  ${{ env.BEACON_SKETCH }}.ino.partitions.bin \
          0xe000  "$BOOT_APP0" \
          0x10000 ${{ env.BEACON_SKETCH }}.ino.bin

    - uses: actions/upload-artifact@v4
      with:
        name: beacon-${{ matrix.chip }}-merged
        path: build/beacon/csi-beacon-${{ matrix.chip }}-merged.bin
        retention-days: 30
  build-pages:
    name: Assemble web flasher
    needs:
    - apply-drop
    - build-receiver
    - build-cardputer
    - build-core2
    - build-beacon
    - preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      short_sha: ${{ needs.build-receiver.outputs.short_sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - uses: actions/download-artifact@v4
      with:
        name: receiver-merged
        path: dl/receiver
    - uses: actions/download-artifact@v4
      with:
        name: cardputer
        path: dl/cardputer
    - uses: actions/download-artifact@v4
      with:
        name: core2
        path: dl/core2
    - uses: actions/download-artifact@v4
      with:
        pattern: beacon-*-merged
        path: dl/beacons
        merge-multiple: true
    - name: Write QR generator script
      run: |
        mkdir -p .ci
        cat > .ci/make_qr.py <<'PYEOF'
        import qrcode, qrcode.image.svg, sys
        url = sys.argv[1]
        out = sys.argv[2]
        qr = qrcode.QRCode(
            version=None,
            error_correction=qrcode.constants.ERROR_CORRECT_M,
            box_size=10, border=4,
        )
        qr.add_data(url)
        qr.make(fit=True)
        img = qr.make_image(
            image_factory=qrcode.image.svg.SvgPathImage,
            fill_color="#050510", back_color="#ffffff",
        )
        img.save(out)
        PYEOF

    - name: Assemble site
      run: |
        set -e
        mkdir -p site
        cp -r docs/. site/
        # docs/bins is intentionally NOT in the repo: binaries are build
        # artifacts, and committed copies were stale ones from the build
        # that never applied the beacon ID.  This directory is created
        # here and filled from the artifacts below.
        mkdir -p site/bins
        cp dl/receiver/csi-radar-s3-merged.bin site/bins/
        cp dl/beacons/csi-beacon-*-merged.bin site/bins/
        python3 -m pip install --quiet 'qrcode[pil]'
        python3 .ci/make_qr.py "https://5t31thphoto.github.io/CSIRadar32/" site/qr.svg
        SHORT_SHA="${{ needs.build-receiver.outputs.short_sha }}"
        BUILD_DATE=$(date -u +%Y-%m-%d)
        # The templated page is flash.html.  It USED to be index.html,
        # and when it was renamed these two lines were not updated, so
        # every build has been substituting a file with no tokens in it
        # while the flasher footer renders the literal {{SHORT_SHA}}.
        # Substitute both, so it keeps working if tokens are ever added
        # to the landing page too.
        for page in site/flash.html site/index.html; do
          sed -i "s|{{SHORT_SHA}}|${SHORT_SHA}|g" "$page"
          sed -i "s|{{BUILD_DATE}}|${BUILD_DATE}|g" "$page"
        done
        touch site/.nojekyll

    - name: Commit fresh bins into docs/bins
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: |
        set -euo pipefail
        BR="${GITHUB_REF_NAME}"
        git fetch --depth=1 origin "$BR"
        git checkout -B "$BR" "origin/$BR"

        mkdir -p docs/bins
        cp dl/receiver/csi-radar-s3-merged.bin docs/bins/
        cp dl/beacons/csi-beacon-*-merged.bin  docs/bins/
        # BOTH Cardputer artefacts.  The MERGED image is the one to
        # reach for: it works with the web flasher, with esptool at
        # 0x0, AND with M5Launcher, which extracts the application from
        # it.  The app-only bin is a smaller alternative for SD users.
        # These jobs are `needs:` of this one, so if they succeeded the
        # artefacts exist.  "|| true" here would publish a site whose
        # download links 404 while the build reports success.
        cp dl/cardputer/mantis-cardputer-adv-merged.bin   docs/bins/
        cp dl/cardputer/mantis-cardputer-adv-app.bin      docs/bins/
        cp dl/core2/mantis-core2-merged.bin               docs/bins/
        cp dl/core2/mantis-core2-app.bin                  docs/bins/

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A docs/bins

        if git diff --cached --quiet; then
          echo "bins unchanged - nothing to commit"
          exit 0
        fi
        COUNT=$(ls -1 docs/bins/*.bin | wc -l)
        git commit -q -m "ci: publish ${COUNT} firmware binaries [skip ci]"
        git push origin "HEAD:${BR}"
        echo "committed ${COUNT} binaries"
        ls -l docs/bins

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
  deploy-pages:
    name: Deploy to Pages
    needs: build-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
