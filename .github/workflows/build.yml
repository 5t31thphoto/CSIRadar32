name: build

on:
  push:
    branches: [ "**" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  ESP32_CORE:    esp32:esp32@3.0.7
  LOVYANGFX_VER: 1.2.0
  RX_SKETCH:    CSI-Radar-S3
  BEACON_SKETCH: CSI-Beacon-Extended

jobs:

  # ═══════════════════════════════════════════════════════════════
  #  apply-drop — "drop a zip in the root and commit" updater
  # ═══════════════════════════════════════════════════════════════
  #  Put any *.zip in the repo root and push.  This job unpacks it
  #  OVER the working tree, commits the result, removes the zip, and
  #  hands the new commit SHA to the build jobs so they compile the
  #  updated source in the SAME run.
  #
  #  Overlay semantics, deliberately:
  #    - files in the zip overwrite files in the repo
  #    - files/folders only in the zip are added
  #    - files NOT in the zip are left completely alone
  #  Nothing is ever deleted.  A partial zip is a safe patch.
  #
  #  If there is no zip in the root this job does nothing and simply
  #  passes through the triggering SHA, so normal pushes behave
  #  exactly as they did before.
  #
  #  No infinite loop: pushes made with GITHUB_TOKEN do not trigger
  #  another workflow run.
  apply-drop:
    name: Apply dropped zip (if any)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      applied: ${{ steps.result.outputs.applied }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for a dropped zip
        id: find
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "none found"
            echo "zip=" >> "$GITHUB_OUTPUT"
          elif [ ${#zips[@]} -gt 1 ]; then
            echo "::error::More than one .zip in the repo root: ${zips[*]}"
            echo "::error::Leave exactly one so it is unambiguous which to apply."
            exit 1
          else
            echo "found: ${zips[0]}"
            echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack over the working tree
        if: steps.find.outputs.zip != ''
        run: |
          set -euo pipefail
          ZIP="${{ steps.find.outputs.zip }}"
          TMP=$(mktemp -d)
          unzip -q "$ZIP" -d "$TMP/x"

          # Zips exported from a folder usually have a single wrapper
          # directory (CSIRadar32-main/).  Use its CONTENTS, not the
          # folder itself, or everything lands one level too deep.
          SRC="$TMP/x"
          if [ "$(ls -A "$SRC" | wc -l)" -eq 1 ]; then
            only="$(ls -A "$SRC")"
            if [ -d "$SRC/$only" ]; then
              echo "unwrapping top-level folder: $only/"
              SRC="$SRC/$only"
            fi
          fi

          # Never let a zip overwrite git internals.
          rm -rf "$SRC/.git"

          # GITHUB_TOKEN CANNOT create or update files under
          # .github/workflows -- GitHub blocks it at the push, and there is
          # no `workflows` scope that can be added to the permissions block
          # to allow it.  Only a PAT with `workflow` scope can.  So the
          # overlay skips them; anything else in .github still applies.
          #
          # This is NOT silent: if the zip carries workflow changes they are
          # reported here so they can be applied by hand.  A dropped-in
          # workflow change that vanished without a word would be worse than
          # the failed push.
          if [ -d "$SRC/.github/workflows" ]; then
            if ! diff -rq "$SRC/.github/workflows" ".github/workflows" >/dev/null 2>&1; then
              echo "::warning::Zip contains workflow changes. They were NOT applied -- GITHUB_TOKEN cannot update .github/workflows. Apply that directory manually."
              echo "--- workflow differences (not applied) ---"
              diff -rq "$SRC/.github/workflows" ".github/workflows" || true
            else
              echo "workflow files identical - nothing to apply"
            fi
            rm -rf "$SRC/.github/workflows"
          fi

          echo "applying $(find "$SRC" -type f | wc -l) files"
          # -a preserves modes and copies dotfiles; trailing /. means
          # "contents of", so this overlays instead of nesting.
          cp -a "$SRC"/. .

          rm -f "$ZIP"
          echo "removed $ZIP so it does not re-apply next push"

      - name: Commit the result
        id: result
        run: |
          set -euo pipefail
          if [ -z "${{ steps.find.outputs.zip }}" ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "zip contents identical to repo; nothing to commit"
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Apply ${{ steps.find.outputs.zip }} [drop-in]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          NEW=$(git rev-parse HEAD)
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "sha=${NEW}"   >> "$GITHUB_OUTPUT"
          echo "committed ${NEW}"

      - name: Summary
        run: |
          echo "### Drop-in updater" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.result.outputs.applied }}" = "true" ]; then
            echo "Applied \`${{ steps.find.outputs.zip }}\` and committed \`${{ steps.result.outputs.sha }}\`." >> $GITHUB_STEP_SUMMARY
            echo "Build jobs below compile that commit." >> $GITHUB_STEP_SUMMARY
          else
            echo "No zip found. Normal build of \`${{ steps.result.outputs.sha }}\`." >> $GITHUB_STEP_SUMMARY
          fi
  build-receiver:
    name: Build receiver (T-Display-S3)
    needs: apply-drop
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit apply-drop produced, so a zip dropped
          # in this push is compiled in this same run.
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install ${{ env.ESP32_CORE }}
      - name: Install LovyanGFX
        run: arduino-cli lib install "LovyanGFX@${{ env.LOVYANGFX_VER }}"
      - name: Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Prep receiver sketch directory
        run: |
          if [ -f "CSI-Radar-S3.ino" ] && [ ! -d "CSI-Radar-S3" ]; then
            mkdir -p CSI-Radar-S3
            shopt -s nullglob
            for f in *.ino *.h *.cpp; do
              [ -f "$f" ] && mv "$f" CSI-Radar-S3/
            done
          fi
          ls CSI-Radar-S3/
      # T-Display-S3 is an ESP32-S3R8: QIO flash + OPI PSRAM.  That pairing
      # is the reason PSRAM init fails here.  Nearly every S3 board
      # definition assumes flash and PSRAM share a bus width -- both quad or
      # both octal -- and this board does not.  PSRAM=opi with an octal
      # flash mode fails; PSRAM=enabled (quad) with QIO flash fails.  It has
      # to be exactly PSRAM=opi + FlashMode=qio.
      #
      # FlashSize is deliberately NOT set: it regenerates the partition
      # table, the current build boots, and flash size is irrelevant to
      # PSRAM init.  Merge offsets below are fixed and use --flash_size
      # keep, so board options flow through without touching them.
      #
      # NOTHING in the firmware depends on PSRAM.  The framebuffer stays in
      # internal DRAM on purpose.  This flag exists so setup() can report
      # whether PSRAM actually initializes -- a fact, from the device,
      # instead of a guess.  A failed init logs and continues; it is not
      # fatal.
      # CDCOnBoot=cdc: belt and braces.  MS_SERIAL_LOG is 0 so the
      # firmware emits nothing on UART0 anyway, but GPIO43/44 are
      # U0TXD/U0RXD and also the peer-link pins -- if anyone ever flips
      # MS_SERIAL_LOG on for bench work, this keeps the console on USB
      # instead of letting it collide with the wire.
      - name: Compile
        run: |
          mkdir -p build/rx
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashMode=qio,CDCOnBoot=cdc \
            --build-property "compiler.optimization_flags=-O2" \
            --output-dir build/rx \
            "${{ env.RX_SKETCH }}"
      - name: Merge into single .bin
        run: |
          pip install esptool
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          cd build/rx
          python -m esptool --chip esp32s3 merge_bin \
            -o csi-radar-s3-merged.bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x0     ${{ env.RX_SKETCH }}.ino.bootloader.bin \
            0x8000  ${{ env.RX_SKETCH }}.ino.partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 ${{ env.RX_SKETCH }}.ino.bin
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-merged
          path: build/rx/csi-radar-s3-merged.bin
          retention-days: 30

  build-beacon:
    name: Build beacon ${{ matrix.chip }} id ${{ matrix.id }}
    needs: apply-drop
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id:   [1, 2, 3, 4, 5, 6]
        chip: [c3, s3]
        include:
          - chip: c3
            chip_family: esp32c3
            fqbn: esp32:esp32:XIAO_ESP32C3
          - chip: s3
            chip_family: esp32s3
            fqbn: esp32:esp32:XIAO_ESP32S3
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit apply-drop produced, so a zip dropped
          # in this push is compiled in this same run.
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install ${{ env.ESP32_CORE }}
      # Set the beacon ID the same way it was being set by hand: edit the
      # one initializer in the sketch, then compile.
      #
      # The previous approach passed -DBEACON_ID_DEFAULT as a build flag,
      # but the sketch never references that macro -- so the flag bound to
      # nothing, every per-ID build produced an identical binary, and every
      # flashed board came up as id 1 with MAC 1A:00:00:00:00:01.  Because
      # slot_for_mac() keys on the MAC, the receiver then collapsed all of
      # them into ONE beacon slot: the symptom was "recognizes them all as
      # id 1 and only connects to one at a time".
      #
      # This patches a WORKING COPY.  The committed firmware still reads
      # `= 1`, so a local Arduino build is unchanged.
      - name: Set beacon id ${{ matrix.id }} in a working copy
        run: |
          set -euo pipefail
          # BEACON_SKETCH is the sketch DIRECTORY (arduino-cli takes a dir).
          # The file to patch is the .ino inside it -- resolve it rather
          # than assuming the Arduino same-name convention holds.
          DIR="${{ env.BEACON_SKETCH }}"
          SRC=$(ls "$DIR"/*.ino 2>/dev/null | head -1)
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::no .ino found in $DIR"; exit 1
          fi
          echo "patching $SRC"
          python3 - "$SRC" "${{ matrix.id }}" <<'PY'
          import re, sys
          path, want = sys.argv[1], int(sys.argv[2])
          src = open(path).read()
          pat = re.compile(r'^(\s*static\s+uint8_t\s+beacon_id\s*=\s*)(\d+)(\s*;)', re.M)
          new, n = pat.subn(lambda m: f"{m.group(1)}{want}{m.group(3)}", src)
          if n != 1:
              sys.exit(f"FATAL: expected exactly 1 beacon_id initializer, found {n}. "
                       "The sketch changed shape -- fix this step rather than "
                       "shipping identical binaries for every id.")
          open(path, 'w').write(new)
          print(f"beacon_id set to {want}")
          PY
          # Verify the edit actually landed. The old failure was SILENT --
          # never let that happen again.
          grep -qE "static +uint8_t +beacon_id +=[[:space:]]*${{ matrix.id }};" "$SRC" \
            || { echo "::error::beacon_id patch did not take"; exit 1; }
          grep -nE "static +uint8_t +beacon_id" "$SRC"

      - name: Compile beacon (id=${{ matrix.id }}, chip=${{ matrix.chip }})
        run: |
          mkdir -p build/beacon
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --output-dir build/beacon \
            "${{ env.BEACON_SKETCH }}"
      - name: Merge into single .bin
        run: |
          pip install esptool
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          cd build/beacon
          OUT="csi-beacon-${{ matrix.chip }}-id${{ matrix.id }}-merged.bin"
          python -m esptool --chip ${{ matrix.chip_family }} merge_bin \
            -o "$OUT" \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x0     ${{ env.BEACON_SKETCH }}.ino.bootloader.bin \
            0x8000  ${{ env.BEACON_SKETCH }}.ino.partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 ${{ env.BEACON_SKETCH }}.ino.bin
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.chip }}-id${{ matrix.id }}-merged
          path: build/beacon/csi-beacon-${{ matrix.chip }}-id${{ matrix.id }}-merged.bin
          retention-days: 30

  build-pages:
    name: Assemble web flasher
    needs: [apply-drop, build-receiver, build-beacon]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commits the fresh bins back into docs/bins
    outputs:
      short_sha: ${{ needs.build-receiver.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit apply-drop produced, so a zip dropped
          # in this push is compiled in this same run.
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: receiver-merged
          path: dl/receiver
      - uses: actions/download-artifact@v4
        with:
          pattern: beacon-*-merged
          path: dl/beacons
          merge-multiple: true
      - name: Write QR generator script
        run: |
          mkdir -p .ci
          cat > .ci/make_qr.py <<'PYEOF'
          import qrcode, qrcode.image.svg, sys
          url = sys.argv[1]
          out = sys.argv[2]
          qr = qrcode.QRCode(
              version=None,
              error_correction=qrcode.constants.ERROR_CORRECT_M,
              box_size=10, border=4,
          )
          qr.add_data(url)
          qr.make(fit=True)
          img = qr.make_image(
              image_factory=qrcode.image.svg.SvgPathImage,
              fill_color="#050510", back_color="#ffffff",
          )
          img.save(out)
          PYEOF
      - name: Assemble site
        run: |
          set -e
          mkdir -p site
          cp -r docs/. site/
          # docs/bins is intentionally NOT in the repo: binaries are build
          # artifacts, and committed copies were stale ones from the build
          # that never applied the beacon ID.  This directory is created
          # here and filled from the artifacts below.
          mkdir -p site/bins
          cp dl/receiver/csi-radar-s3-merged.bin site/bins/
          cp dl/beacons/csi-beacon-*-merged.bin site/bins/
          python3 -m pip install --quiet 'qrcode[pil]'
          python3 .ci/make_qr.py "https://5t31thphoto.github.io/CSIRadar32/" site/qr.svg
          SHORT_SHA="${{ needs.build-receiver.outputs.short_sha }}"
          BUILD_DATE=$(date -u +%Y-%m-%d)
          # The templated page is flash.html.  It USED to be index.html,
          # and when it was renamed these two lines were not updated, so
          # every build has been substituting a file with no tokens in it
          # while the flasher footer renders the literal {{SHORT_SHA}}.
          # Substitute both, so it keeps working if tokens are ever added
          # to the landing page too.
          for page in site/flash.html site/index.html; do
            sed -i "s|{{SHORT_SHA}}|${SHORT_SHA}|g" "$page"
            sed -i "s|{{BUILD_DATE}}|${BUILD_DATE}|g" "$page"
          done
          touch site/.nojekyll
      # Publish the freshly built binaries back into docs/bins so the repo
      # always carries flashable firmware that MATCHES its source.  The
      # deployed site already gets them via site/bins; this makes opening
      # docs/flash.html straight off a local clone work too.
      #
      # Only on the default branch, and only when the bytes actually
      # changed -- a source-only push rebuilds byte-identical binaries and
      # produces no commit, so history does not grow for nothing.  Each
      # real firmware change is ~13 MB across 13 binaries.
      #
      # Pushes made with GITHUB_TOKEN do not trigger another workflow run,
      # so this cannot loop.
      - name: Commit fresh bins into docs/bins
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME}"
          git fetch --depth=1 origin "$BR"
          git checkout -B "$BR" "origin/$BR"

          mkdir -p docs/bins
          cp dl/receiver/csi-radar-s3-merged.bin docs/bins/
          cp dl/beacons/csi-beacon-*-merged.bin  docs/bins/

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/bins

          if git diff --cached --quiet; then
            echo "bins unchanged - nothing to commit"
            exit 0
          fi
          COUNT=$(ls -1 docs/bins/*.bin | wc -l)
          git commit -q -m "ci: publish ${COUNT} firmware binaries [skip ci]"
          git push origin "HEAD:${BR}"
          echo "committed ${COUNT} binaries"
          ls -l docs/bins

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy to Pages
    needs: build-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
