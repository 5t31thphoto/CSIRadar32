name: build
on:
  push:
    branches:
    - '**'
    tags:
    - v*
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
env:
  ESP32_CORE: esp32:esp32@3.0.7
  LOVYANGFX_VER: 1.2.0
  RX_SKETCH: CSI-Radar-S3
  BEACON_SKETCH: CSI-Beacon-Extended
jobs:
  apply-drop:
    name: Apply dropped zip (if any)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      applied: ${{ steps.result.outputs.applied }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Look for a dropped zip
      id: find
      run: "shopt -s nullglob\nzips=(*.zip)\nif [ ${#zips[@]} -eq 0 ]; then\n  echo \"none found\"\n  echo \"zip=\" >> \"$GITHUB_OUTPUT\"\nelif [ ${#zips[@]} -gt 1 ]; then\n  echo \"::error::More than one .zip in the repo root: ${zips[*]}\"\n  echo \"::error::Leave exactly one so it is unambiguous which to apply.\"\n  exit 1\nelse\n  echo \"found: ${zips[0]}\"\n  echo \"zip=${zips[0]}\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Unpack over the working tree
      if: steps.find.outputs.zip != ''
      run: "set -euo pipefail\nZIP=\"${{ steps.find.outputs.zip }}\"\nTMP=$(mktemp -d)\nunzip -q \"$ZIP\" -d \"$TMP/x\"\n\n# Zips exported from a folder usually have a single wrapper\n# directory (CSIRadar32-main/).  Use its CONTENTS, not the\n# folder itself, or everything lands one level too deep.\nSRC=\"$TMP/x\"\nif [ \"$(ls -A \"$SRC\" | wc -l)\" -eq 1 ]; then\n  only=\"$(ls -A \"$SRC\")\"\n  if [ -d \"$SRC/$only\" ]; then\n    echo \"unwrapping top-level folder: $only/\"\n    SRC=\"$SRC/$only\"\n  fi\nfi\n\n# Never let a zip overwrite git internals.\nrm -rf \"$SRC/.git\"\n\n# GITHUB_TOKEN CANNOT create or update files under\n# .github/workflows -- GitHub blocks it at the push, and there is\n# no `workflows` scope that can be added to the permissions block\n# to allow it.  Only a PAT with `workflow` scope can.  So the\n# overlay skips them; anything else in .github still applies.\n#\n# This is NOT silent: if the zip carries workflow changes they are\n# reported here so they can be applied by hand.  A dropped-in\n# workflow change that vanished without a word would be worse than\n# the failed push.\nif [ -d \"$SRC/.github/workflows\" ]; then\n  if ! diff -rq \"$SRC/.github/workflows\" \".github/workflows\" >/dev/null 2>&1; then\n    echo \"::warning::Zip contains workflow changes. They were NOT applied -- GITHUB_TOKEN cannot update .github/workflows. Apply that directory manually.\"\n    echo \"--- workflow differences (not applied) ---\"\n    diff -rq \"$SRC/.github/workflows\" \".github/workflows\" || true\n  else\n    echo \"workflow files identical - nothing to apply\"\n  fi\n  rm -rf \"$SRC/.github/workflows\"\nfi\n\necho \"applying $(find \"$SRC\" -type f | wc -l) files\"\n# -a preserves modes and copies dotfiles; trailing /. means\n# \"contents of\", so this overlays instead of nesting.\ncp -a \"$SRC\"/. .\n\nrm -f \"$ZIP\"\necho \"removed $ZIP so it does not re-apply next push\"\n"
    - name: Commit the result
      id: result
      run: "set -euo pipefail\nif [ -z \"${{ steps.find.outputs.zip }}\" ]; then\n  echo \"applied=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"sha=${GITHUB_SHA}\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\ngit config user.name  \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\nif git diff --cached --quiet; then\n  echo \"zip contents identical to repo; nothing to commit\"\n  echo \"applied=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"sha=${GITHUB_SHA}\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\ngit commit -q -m \"Apply ${{ steps.find.outputs.zip }} [drop-in]\"\ngit push origin HEAD:\"${GITHUB_REF_NAME}\"\nNEW=$(git rev-parse HEAD)\necho \"applied=true\" >> \"$GITHUB_OUTPUT\"\necho \"sha=${NEW}\"   >> \"$GITHUB_OUTPUT\"\necho \"committed ${NEW}\"\n"
    - name: Summary
      run: "echo \"### Drop-in updater\" >> $GITHUB_STEP_SUMMARY\nif [ \"${{ steps.result.outputs.applied }}\" = \"true\" ]; then\n  echo \"Applied \\`${{ steps.find.outputs.zip }}\\` and committed \\`${{ steps.result.outputs.sha }}\\`.\" >> $GITHUB_STEP_SUMMARY\n  echo \"Build jobs below compile that commit.\" >> $GITHUB_STEP_SUMMARY\nelse\n  echo \"No zip found. Normal build of \\`${{ steps.result.outputs.sha }}\\`.\" >> $GITHUB_STEP_SUMMARY\nfi\n"
  preflight:
    name: Pre-flight (compile every firmware, no toolchain)
    needs: apply-drop
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - name: Compile every sketch as Arduino builds it
      run: 'set -euo pipefail

        # Flat directory, ARDUINO defined, real vendor header shapes.

        # Catches missing includes and missing files in SECONDS, before

        # any job spends ten minutes installing a toolchain.

        ./tools/preflight.sh

        '
    - name: Probe opcodes match the T-Display
      run: 'set -euo pipefail

        g++ -std=c++17 -fsyntax-only -I . -I tools/hostshim tools/opcode_check.cpp

        '
  build-receiver:
    name: Build receiver (T-Display-S3)
    needs:
    - apply-drop
    - preflight
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - uses: arduino/setup-arduino-cli@v2
    - name: Install ESP32 core
      run: 'arduino-cli config init

        arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

        arduino-cli core update-index

        arduino-cli core install ${{ env.ESP32_CORE }}

        '
    - name: Install LovyanGFX
      run: arduino-cli lib install "LovyanGFX@${{ env.LOVYANGFX_VER }}"
    - name: Cache Rust toolchain and build
      uses: actions/cache@v4
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          rust/rfcore/target

          '
        key: xtensa-${{ runner.os }}-${{ hashFiles('rust/rfcore/Cargo.toml') }}-${{ hashFiles('rust/rfcore/src/lib.rs') }}
        restore-keys: 'xtensa-${{ runner.os }}-${{ hashFiles(''rust/rfcore/Cargo.toml'') }}-

          xtensa-${{ runner.os }}-

          '
    - name: Install Rust Xtensa toolchain
      uses: esp-rs/xtensa-toolchain@v1.6
      env:
        GITHUB_TOKEN: ''
      with:
        version: 1.96.0.0
        default: true
        buildtargets: esp32s3
    - name: Verify Rust Xtensa toolchain
      run: "set -euo pipefail\nrustup toolchain list\nrustc +esp --version --verbose\ncargo +esp --version --verbose\nrustc +esp --print target-list | grep -Fx xtensa-esp32s3-none-elf\n# Listing the target is NOT the same as having its core.  The\n# observed failure passed this check and then failed to build,\n# so prove the standard library is actually present.\nSYSROOT=$(rustc +esp --print sysroot)\nls \"$SYSROOT/lib/rustlib/xtensa-esp32s3-none-elf/lib/\" | head -5 \\\n  || { echo \"::error::xtensa-esp32s3-none-elf core is not installed\"; exit 1; }\n"
    - name: Build Rust RF inference core
      run: 'set -euo pipefail

        cargo +esp build --release --target xtensa-esp32s3-none-elf --manifest-path rust/rfcore/Cargo.toml

        test -s rust/rfcore/target/xtensa-esp32s3-none-elf/release/libmantis_rfcore.a

        ar t rust/rfcore/target/xtensa-esp32s3-none-elf/release/libmantis_rfcore.a | grep -q .

        '
    - name: Short SHA
      id: sha
      run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    - name: Prep receiver sketch directory
      run: "if [ -f \"CSI-Radar-S3.ino\" ] && [ ! -d \"CSI-Radar-S3\" ]; then\n  mkdir -p CSI-Radar-S3\n  shopt -s nullglob\n  for f in *.ino *.h *.cpp; do\n    [ -f \"$f\" ] && mv \"$f\" CSI-Radar-S3/\n  done\nfi\nls CSI-Radar-S3/\n"
    - name: Compile
      run: "set -o pipefail\nmkdir -p build/rx\narduino-cli compile \\\n  --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashMode=qio,CDCOnBoot=cdc \\\n  --build-property \"compiler.optimization_flags=-O2\" \\\n  --build-property \"compiler.cpp.extra_flags=-I${{ github.workspace }}/rust/rfcore\" \\\n  --build-property \"compiler.c.extra_flags=-I${{ github.workspace }}/rust/rfcore\" \\\n  --build-property \"compiler.c.elf.extra_flags=-L${{ github.workspace }}/rust/rfcore/target/xtensa-esp32s3-none-elf/release -Wl,--whole-archive -l:libmantis_rfcore.a -Wl,--no-whole-archive\" \\\n  --output-dir build/rx \\\n  \"${{ env.RX_SKETCH }}\" 2>&1 | tee build/compile.log\n"
    - name: Check DRAM headroom
      run: "set -o pipefail\nLINE=$(grep -i \"Global variables use\" build/compile.log | head -1 || true)\necho \"$LINE\"\nUSED=$(echo \"$LINE\" | grep -oE 'use [0-9]+' | grep -oE '[0-9]+' | head -1)\nFREE=$(echo \"$LINE\" | grep -oE 'leaving [0-9]+' | grep -oE '[0-9]+' | head -1)\nif [ -z \"${FREE:-}\" ]; then\n  # A changed log format is not a broken firmware.  Say so\n  # loudly and carry on -- failing here would block a build\n  # that compiles and runs perfectly well.\n  echo \"::warning::could not parse DRAM figures - headroom unverified\"\n  exit 0\nfi\necho \"globals ${USED:-?} B, ${FREE} B left for local variables\"\n# The sprite alone needs 170*320*2 = 108800 B from that pool.\nif [ \"$FREE\" -lt 120000 ]; then\n  echo \"::error::Only ${FREE} B of DRAM left; the 108800 B display\"\n  echo \"::error::sprite cannot fit. UI would fall back to direct-draw.\"\n  exit 1\nfi\nif [ \"$FREE\" -lt 140000 ]; then\n  echo \"::warning::DRAM headroom is thin (${FREE} B). Sprite needs 108800 B.\"\nfi\n"
    - name: Verify the REAL Rust core is linked
      run: "set -euo pipefail\nELF=\"build/rx/${{ env.RX_SKETCH }}.ino.elf\"\ntest -f \"$ELF\"\n# Look in every plausible place before concluding nm is absent.\n# Failing the build because a TOOL moved would break a build\n# that is otherwise perfectly good -- the gate must fire on a\n# stub, not on its own fragility.\nNM=\"\"\nfor cand in \\\n  $(find ~/.arduino15 -name 'xtensa-esp32s3-elf-nm' -type f 2>/dev/null) \\\n  $(find ~/.arduino15 -name 'xtensa-esp32-elf-nm'   -type f 2>/dev/null) \\\n  $(command -v xtensa-esp32s3-elf-nm 2>/dev/null) \\\n  $(command -v llvm-nm 2>/dev/null) \\\n  $(command -v nm 2>/dev/null); do\n  [ -x \"$cand\" ] && { NM=\"$cand\"; break; }\ndone\nif [ -z \"$NM\" ]; then\n  echo \"::warning::no nm found anywhere - cannot verify the Rust core\"\n  echo \"::warning::the build is otherwise complete; verify on hardware\"\n  exit 0\nfi\necho \"using nm: $NM\"\n# NOTE: no strtonum().  ubuntu-latest ships mawk as the default\n# awk and strtonum() is a GAWK extension -- it would abort this\n# step with \"function strtonum never defined\".  Pull the hex\n# field out with awk and convert in the shell instead.\nSZ_HEX=$(\"$NM\" -S \"$ELF\" | awk '$4 == \"mantis_rf_observe\" { print $2; exit }')\nSZ=$((16#${SZ_HEX:-0}))\necho \"mantis_rf_observe = ${SZ} bytes (0x${SZ_HEX:-0})\"\nif [ \"$SZ\" -lt 64 ]; then\n  echo \"::error::WEAK FALLBACK linked, not the Rust core.\"\n  echo \"::error::mantis_rf_observe is ${SZ} bytes - that is a stub.\"\n  exit 1\nfi\necho \"real Rust core linked\"\n"
    - name: Merge into single .bin
      run: "pip install esptool\nBOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)\ncd build/rx\npython -m esptool --chip esp32s3 merge_bin \\\n  -o csi-radar-s3-merged.bin \\\n  --flash_mode keep --flash_freq keep --flash_size keep \\\n  0x0     ${{ env.RX_SKETCH }}.ino.bootloader.bin \\\n  0x8000  ${{ env.RX_SKETCH }}.ino.partitions.bin \\\n  0xe000  \"$BOOT_APP0\" \\\n  0x10000 ${{ env.RX_SKETCH }}.ino.bin\n"
    - uses: actions/upload-artifact@v4
      with:
        name: receiver-merged
        path: build/rx/csi-radar-s3-merged.bin
        retention-days: 30
  build-cardputer:
    needs:
    - apply-drop
    - preflight
    runs-on: ubuntu-latest
    env:
      CP_SKETCH: Mantis-Cardputer-Adv
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - uses: arduino/setup-arduino-cli@v1
    - name: Install ESP32 + M5Stack cores
      run: "set -euo pipefail\narduino-cli config init --overwrite\narduino-cli config add board_manager.additional_urls \\\n  https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json\narduino-cli config add board_manager.additional_urls \\\n  https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json\narduino-cli core update-index\n# Vendor docs require M5Stack board manager >= 3.2.3 for the ADV.\n# RETRY THE CORE INSTALL.\n#\n# Observed failure: \"tls: failed to verify certificate: x509:\n# certificate is not valid for any names, but wanted to match\n# github.com\" while fetching esp32-3.0.7.zip.  That is a CDN\n# or proxy problem between the runner and GitHub, not anything\n# in this repo, and it clears on a retry.\nfor attempt in 1 2 3 4; do\n  if arduino-cli core install esp32:esp32@3.0.7; then break; fi\n  if [ \"$attempt\" = \"4\" ]; then\n    echo \"::error::esp32 core install failed after 4 attempts\"; exit 1; fi\n  echo \"::warning::esp32 core install attempt $attempt failed; retrying\"\n  arduino-cli cache clean || true\n  arduino-cli core update-index\n  sleep 20\ndone\n\n# M5STACK CORE INSTALL, WITH RETRIES.\n#\n# Observed failure:\n#   \"fetched archive size differs from size specified in index:\n#    20452175 != 20447892\"\n#\n# That is the VENDOR'S index disagreeing with the vendor's own\n# 20 MB archive.  Nothing we control, and a pinned version has\n# no way around it -- so refresh the index and retry, then fall\n# back to whatever the index currently agrees with rather than\n# failing the build on an upstream checksum.\n# LATEST FIRST, pinned version as the fallback.\n#\n# The pinned 3.2.3 archive is what hit \"fetched archive size\n# differs from size specified in index\" -- a bad entry in the\n# vendor's index for that specific release.  The unpinned\n# install fetched 3.3.9 without trouble in the same run.\n#\n# The ADV needs >= 3.2.3, and latest satisfies that, so taking\n# latest is both more likely to work and still correct.  The\n# floor check below is what actually enforces the requirement.\nok=0\nfor attempt in 1 2 3; do\n  if arduino-cli core install m5stack:esp32; then ok=1; break; fi\n  echo \"::warning::m5stack install attempt $attempt failed; refreshing index\"\n  arduino-cli cache clean || true\n  arduino-cli core update-index\n  sleep 10\ndone\nif [ \"$ok\" -eq 0 ]; then\n  echo \"::warning::latest unavailable; trying the pinned 3.2.3\"\n  arduino-cli core install m5stack:esp32@3.2.3\nfi\nVER=$(arduino-cli core list | awk '/m5stack:esp32/{print $2}')\necho \"m5stack core version: $VER\"\n# The ADV needs >= 3.2.3.  A silent downgrade would compile and\n# then misbehave on hardware, so refuse it here.\nif [ -z \"$VER\" ]; then echo \"::error::m5stack core did not install\"; exit 1; fi\nMAJOR=${VER%%.*}; REST=${VER#*.}; MINOR=${REST%%.*}\nif [ \"$MAJOR\" -lt 3 ] || { [ \"$MAJOR\" -eq 3 ] && [ \"$MINOR\" -lt 2 ]; }; then\n  echo \"::error::m5stack core $VER is older than the 3.2.3 the ADV requires\"; exit 1\nfi\n"
    - name: Install M5 libraries
      run: 'set -euo pipefail

        # Minimum versions from the M5 documentation for Cardputer-Adv.

        # The battery page is the strictest and it governs: board

        # manager >= 3.2.3, M5Cardputer >= 1.1.1, M5Unified >= 0.2.10.

        # Pinning the floor rather than taking "latest" means a library

        # release cannot silently change behaviour between builds.

        arduino-cli lib install "M5Cardputer@1.1.1"

        arduino-cli lib install "M5Unified@0.2.10"

        arduino-cli lib install "M5GFX@0.2.10"

        # ESP8266Audio must be EXACTLY 1.9.7.  The working Cardputer-Adv

        # MP3 players pin this version; later releases change the

        # AudioOutput interface and the build either fails or produces

        # no sound with nothing in the log to say why.

        arduino-cli lib install "ESP8266Audio@1.9.7"

        arduino-cli lib list

        '
    - name: Prep sketch directory
      run: "set -euo pipefail\nmkdir -p \"${{ env.CP_SKETCH }}\"\n# NO \"|| true\" ON THE COPIES.\n#\n# Swallowing a failed copy is how a sketch directory ends up\n# missing a header and fails hundreds of lines later with\n# \"not declared in this scope\" -- which reads as a code bug\n# and is a packaging bug.  If a file that should exist does\n# not, fail here, where the message is the truth.\ncp cardputer/*.h \"${{ env.CP_SKETCH }}/\"\ncp cardputer/Mantis-Cardputer-Adv.ino \"${{ env.CP_SKETCH }}/\"\n# The mesh and inference headers are shared with the receiver;\n# the Cardputer is a full receiver and uses all of them.\ncp mantis_*.h \"${{ env.CP_SKETCH }}/\"\nmv \"${{ env.CP_SKETCH }}/Mantis-Cardputer-Adv.ino\" \\\n   \"${{ env.CP_SKETCH }}/${{ env.CP_SKETCH }}.ino\" 2>/dev/null || true\nls -la \"${{ env.CP_SKETCH }}\"\n"
    - name: Compile
      run: "set -o pipefail\nmkdir -p build/cardputer\n# Board defaults, for the same reason as the Core2: the\n# m5stack_cardputer definition already knows its flash size\n# and partition layout, and an override I cannot verify is\n# just another way to fail.\narduino-cli board details --fqbn m5stack:esp32:m5stack_cardputer | head -30 || true\narduino-cli compile \\\n  --fqbn m5stack:esp32:m5stack_cardputer \\\n  --output-dir build/cardputer \\\n  \"${{ env.CP_SKETCH }}\" 2>&1 | tee build/cp_compile.log\n"
    - name: Make BOTH binaries
      run: "set -euo pipefail\npip install esptool\ncd build/cardputer\nBOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)\n\n# 1. MERGED -- for the web flasher, written at offset 0.\npython -m esptool --chip esp32s3 merge_bin \\\n  -o mantis-cardputer-adv-merged.bin \\\n  --flash_mode dio --flash_freq 80m --flash_size 8MB \\\n  0x0     \"${{ env.CP_SKETCH }}.ino.bootloader.bin\" \\\n  0x8000  \"${{ env.CP_SKETCH }}.ino.partitions.bin\" \\\n  0xe000  \"$BOOT_APP0\" \\\n  0x10000 \"${{ env.CP_SKETCH }}.ino.bin\"\n\n# 2. APP-ONLY -- the bare application image.\n# M5Launcher accepts this form as well (the charge-mode app for\n# this board ships exactly this way), and it is a much smaller\n# SD download.  Offered as an alternative, not a requirement.\ncp \"${{ env.CP_SKETCH }}.ino.bin\" mantis-cardputer-adv-app.bin\n\nM=$(stat -c%s mantis-cardputer-adv-merged.bin)\nA=$(stat -c%s mantis-cardputer-adv-app.bin)\necho \"merged $M B   app-only $A B\"\n\n# TRUNCATION IS THE PROPERTY THAT MATTERS FOR THE LAUNCHER.\n# A merged image padded to the full 8 MB flash would still\n# flash correctly over USB but would be a 8 MB file to copy to\n# an SD card and to parse.  Our receiver image is 1.15 MB on an\n# 8 MB flash, so merge_bin is not padding -- assert it stays\n# that way rather than trusting it.\nif [ \"$M\" -gt 4194304 ]; then\n  echo \"::error::merged bin is ${M} B - looks padded to flash size.\"\n  echo \"::error::M5Launcher wants a TRUNCATED merged image.\"\n  exit 1\nfi\nif [ \"$A\" -ge \"$M\" ]; then\n  echo \"::error::app-only bin is not smaller than merged - wrong file\"\n  exit 1\nfi\n# Both must carry the ESP image magic 0xE9 as their first byte.\nfor f in mantis-cardputer-adv-merged.bin mantis-cardputer-adv-app.bin; do\n  HDR=$(od -An -tx1 -N1 \"$f\" | tr -d ' \\n')\n  if [ \"$HDR\" != \"e9\" ]; then\n    echo \"::error::$f has no ESP image magic (got 0x$HDR)\"\n    exit 1\n  fi\ndone\n"
    - uses: actions/upload-artifact@v4
      with:
        name: cardputer
        path: build/cardputer/mantis-cardputer-adv-*.bin
  build-core2:
    needs:
    - apply-drop
    - preflight
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - uses: arduino/setup-arduino-cli@v1
    - name: Install ESP32 core
      run: "set -euo pipefail\narduino-cli config init --overwrite\narduino-cli config add board_manager.additional_urls \\\n  https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json\narduino-cli core update-index\n# RETRY THE CORE INSTALL.\n#\n# Observed failure: \"tls: failed to verify certificate: x509:\n# certificate is not valid for any names, but wanted to match\n# github.com\" while fetching esp32-3.0.7.zip.  That is a CDN\n# or proxy problem between the runner and GitHub, not anything\n# in this repo, and it clears on a retry.\nfor attempt in 1 2 3 4; do\n  if arduino-cli core install esp32:esp32@3.0.7; then break; fi\n  if [ \"$attempt\" = \"4\" ]; then\n    echo \"::error::esp32 core install failed after 4 attempts\"; exit 1; fi\n  echo \"::warning::esp32 core install attempt $attempt failed; retrying\"\n  arduino-cli cache clean || true\n  arduino-cli core update-index\n  sleep 20\ndone\n"
    - name: Install M5 libraries
      run: 'set -euo pipefail

        arduino-cli lib install "M5Unified"

        arduino-cli lib install "M5GFX"

        # Exactly 1.9.7: later releases change the AudioOutput interface

        # and produce a build that either fails or makes no sound.

        arduino-cli lib install "ESP8266Audio@1.9.7"

        arduino-cli lib list

        '
    - name: Prep sketch
      run: 'set -euo pipefail

        mkdir -p Core2Build

        cp core2/Mantis-Core2.ino Core2Build/Core2Build.ino

        cp core2/*.h Core2Build/

        # The IMU, alarm table and MP3 decoder are shared with the

        # Cardputer.  They are mantis_*.h now and arrive with the copy

        # below -- keeping them under cardputer/ is exactly how one of

        # them ended up hard-including <M5Cardputer.h> and breaking

        # this build.

        cp mantis_*.h Core2Build/

        ls -la Core2Build

        '
    - name: Compile
      run: "set -o pipefail\nmkdir -p build/core2\n# NO BUILD-PROPERTY OVERRIDES.\n#\n# The m5stack_core2 board definition already sets 16 MB flash,\n# the right partition scheme and PSRAM.  Overriding those with\n# values I could not verify only creates ways for the build to\n# fail -- a partition name that is not a real .csv fails the\n# link, and forcing BOARD_HAS_PSRAM through extra_flags sets\n# the macro without enabling the PSRAM the board init needs.\n#\n# The board defaults are correct.  Use them.\narduino-cli board details --fqbn esp32:esp32:m5stack_core2 | head -30 || true\narduino-cli compile \\\n  --fqbn esp32:esp32:m5stack_core2 \\\n  --output-dir build/core2 \\\n  Core2Build 2>&1 | tee build/core2_compile.log\n"
    - name: Package both binaries
      run: "set -euo pipefail\npip install esptool\ncd build/core2\nBOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)\npython -m esptool --chip esp32 merge_bin \\\n  -o mantis-core2-merged.bin \\\n  --flash_mode dio --flash_freq 80m --flash_size 16MB \\\n  0x1000  Core2Build.ino.bootloader.bin \\\n  0x8000  Core2Build.ino.partitions.bin \\\n  0xe000  \"$BOOT_APP0\" \\\n  0x10000 Core2Build.ino.bin\n# App-only image, for M5Launcher from SD.\ncp Core2Build.ino.bin mantis-core2-app.bin\nM=$(stat -c%s mantis-core2-merged.bin); A=$(stat -c%s mantis-core2-app.bin)\necho \"merged $M B   app $A B\"\n# Truncated, not padded: a 16 MB file would be miserable on an\n# SD card and slow for the launcher to parse.\nif [ \"$M\" -gt 8388608 ]; then\n  echo \"::error::merged bin is ${M} B - looks padded to flash size\"; exit 1; fi\nif [ \"$A\" -ge \"$M\" ]; then\n  echo \"::error::app bin not smaller than merged - wrong file\"; exit 1; fi\n"
    - uses: actions/upload-artifact@v4
      with:
        name: core2
        path: build/core2/mantis-core2-*.bin
  build-beacon:
    name: Build smart beacon (${{ matrix.chip }})
    needs:
    - apply-drop
    - preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chip:
        - c3
        - s3
        include:
        - chip: c3
          chip_family: esp32c3
          fqbn: esp32:esp32:XIAO_ESP32C3
        - chip: s3
          chip_family: esp32s3
          fqbn: esp32:esp32:XIAO_ESP32S3
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - uses: arduino/setup-arduino-cli@v2
    - name: Install ESP32 core
      run: 'arduino-cli config init

        arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

        arduino-cli core update-index

        arduino-cli core install ${{ env.ESP32_CORE }}

        '
    - name: Prep sketch (ONE firmware for every beacon)
      run: "set -euo pipefail\n# No per-device patching.  The beacon claims its id from the\n# mesh at runtime and persists it in NVS; the physical box is\n# identified permanently by a MAC-derived uid.  That removed\n# six build jobs, six artefacts and six manifests, and it\n# removed the failure mode where the wrong bin went to the\n# wrong box.\nmkdir -p BeaconBuild\ncp CSI-Beacon-Mantis/CSI-Beacon-Mantis.ino BeaconBuild/BeaconBuild.ino\ncp mantis_*.h BeaconBuild/\n\n# HEADER/SKETCH DRIFT GUARD.\n#\n# A drop that updates the sketch but not a header produces a\n# wall of \"struct X has no member named Y\" that reads like a\n# code bug and is a packaging bug.  Checked as MEMBER USE ->\n# MEMBER DECLARATION, not as a bare substring: grepping for\n# \"uid\" also matches mantis_uid_from_mac and uid_bind, so a\n# substring version passes happily with the field deleted.\ncheck_pair() {\n  if grep -qE \"$1\" BeaconBuild/BeaconBuild.ino \\\n     && ! grep -qhE \"$2\" BeaconBuild/mantis_*.h; then\n    echo \"::error::sketch uses $3 but no mantis header declares it.\"\n    echo \"::error::Headers and sketch are from different versions.\"\n    exit 1\n  fi\n}\ncheck_pair '\\.uid[^_a-zA-Z]'     'uint16_t[[:space:]]+uid;'         'MantisAirFrame::uid'\ncheck_pair '\\.blocked_mask'      'uint8_t[[:space:]]+blocked_mask;' 'MantisPerspective::blocked_mask'\ncheck_pair '\\.blocked[^_a-zA-Z]' 'bool[[:space:]]+blocked;'         'MantisBeaconLink::blocked'\ncheck_pair 'mantis_uid_from_mac'  'mantis_uid_from_mac'              'mantis_uid_from_mac()'\n\n# PROBE CONTROL OPCODES: COMPILED, NOT GREPPED.\n#\n# The previous check grepped config.h for literal strings with\n# exact spacing.  config.h writes three spaces where the guard\n# expected five, so it failed on WHITESPACE and broke the\n# build while every opcode was correct.  A static_assert\n# cannot care about formatting.\n# config.h includes <Arduino.h>, which a bare runner does not\n# have -- so the check needs a shim on the include path.  The\n# first version omitted it and failed with \"Arduino.h: No such\n# file or directory\", reported as opcode drift, which is a\n# lie: it never got far enough to compare anything.\ng++ -std=c++17 -fsyntax-only -I . -I tools/hostshim \\\n  tools/opcode_check.cpp \\\n  || { echo \"::error::probe opcode/struct drift vs config.h\"; exit 1; }\n\n# PRE-FLIGHT: compile all four firmwares the way Arduino does.\n# See tools/preflight.sh.  Seconds, no toolchain.\n./tools/preflight.sh\necho \"sketch, headers and control opcodes agree\"\nls -la BeaconBuild\n"
    - name: Compile beacon (chip=${{ matrix.chip }})
      run: "mkdir -p build/beacon\narduino-cli compile \\\n  --fqbn ${{ matrix.fqbn }} \\\n  --output-dir build/beacon \\\n  \"BeaconBuild\"\n"
    - name: Merge into single .bin
      run: "pip install esptool\nBOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)\ncd build/beacon\nOUT=\"csi-beacon-${{ matrix.chip }}-merged.bin\"\npython -m esptool --chip ${{ matrix.chip_family }} merge_bin \\\n  -o \"$OUT\" \\\n  --flash_mode keep --flash_freq keep --flash_size keep \\\n  0x0     ${{ env.BEACON_SKETCH }}.ino.bootloader.bin \\\n  0x8000  ${{ env.BEACON_SKETCH }}.ino.partitions.bin \\\n  0xe000  \"$BOOT_APP0\" \\\n  0x10000 ${{ env.BEACON_SKETCH }}.ino.bin\n"
    - uses: actions/upload-artifact@v4
      with:
        name: beacon-${{ matrix.chip }}-merged
        path: build/beacon/csi-beacon-${{ matrix.chip }}-merged.bin
        retention-days: 30
  build-pages:
    name: Assemble web flasher
    needs:
    - apply-drop
    - build-receiver
    - build-cardputer
    - build-core2
    - build-beacon
    - preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      short_sha: ${{ needs.build-receiver.outputs.short_sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.apply-drop.outputs.sha }}
    - uses: actions/download-artifact@v4
      with:
        name: receiver-merged
        path: dl/receiver
    - uses: actions/download-artifact@v4
      with:
        name: cardputer
        path: dl/cardputer
    - uses: actions/download-artifact@v4
      with:
        name: core2
        path: dl/core2
    - uses: actions/download-artifact@v4
      with:
        pattern: beacon-*-merged
        path: dl/beacons
        merge-multiple: true
    - name: Write QR generator script
      run: "mkdir -p .ci\ncat > .ci/make_qr.py <<'PYEOF'\nimport qrcode, qrcode.image.svg, sys\nurl = sys.argv[1]\nout = sys.argv[2]\nqr = qrcode.QRCode(\n    version=None,\n    error_correction=qrcode.constants.ERROR_CORRECT_M,\n    box_size=10, border=4,\n)\nqr.add_data(url)\nqr.make(fit=True)\nimg = qr.make_image(\n    image_factory=qrcode.image.svg.SvgPathImage,\n    fill_color=\"#050510\", back_color=\"#ffffff\",\n)\nimg.save(out)\nPYEOF\n"
    - name: Assemble site
      run: "set -e\nmkdir -p site\ncp -r docs/. site/\n# docs/bins is intentionally NOT in the repo: binaries are build\n# artifacts, and committed copies were stale ones from the build\n# that never applied the beacon ID.  This directory is created\n# here and filled from the artifacts below.\nmkdir -p site/bins\ncp dl/receiver/csi-radar-s3-merged.bin site/bins/\ncp dl/beacons/csi-beacon-*-merged.bin site/bins/\npython3 -m pip install --quiet 'qrcode[pil]'\npython3 .ci/make_qr.py \"https://5t31thphoto.github.io/CSIRadar32/\" site/qr.svg\nSHORT_SHA=\"${{ needs.build-receiver.outputs.short_sha }}\"\nBUILD_DATE=$(date -u +%Y-%m-%d)\n# The templated page is flash.html.  It USED to be index.html,\n# and when it was renamed these two lines were not updated, so\n# every build has been substituting a file with no tokens in it\n# while the flasher footer renders the literal {{SHORT_SHA}}.\n# Substitute both, so it keeps working if tokens are ever added\n# to the landing page too.\nfor page in site/flash.html site/index.html; do\n  sed -i \"s|{{SHORT_SHA}}|${SHORT_SHA}|g\" \"$page\"\n  sed -i \"s|{{BUILD_DATE}}|${BUILD_DATE}|g\" \"$page\"\ndone\ntouch site/.nojekyll\n"
    - name: Commit fresh bins into docs/bins
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: "set -euo pipefail\nBR=\"${GITHUB_REF_NAME}\"\ngit fetch --depth=1 origin \"$BR\"\ngit checkout -B \"$BR\" \"origin/$BR\"\n\nmkdir -p docs/bins\ncp dl/receiver/csi-radar-s3-merged.bin docs/bins/\ncp dl/beacons/csi-beacon-*-merged.bin  docs/bins/\n# BOTH Cardputer artefacts.  The MERGED image is the one to\n# reach for: it works with the web flasher, with esptool at\n# 0x0, AND with M5Launcher, which extracts the application from\n# it.  The app-only bin is a smaller alternative for SD users.\n# These jobs are `needs:` of this one, so if they succeeded the\n# artefacts exist.  \"|| true\" here would publish a site whose\n# download links 404 while the build reports success.\ncp dl/cardputer/mantis-cardputer-adv-merged.bin   docs/bins/\ncp dl/cardputer/mantis-cardputer-adv-app.bin      docs/bins/\ncp dl/core2/mantis-core2-merged.bin               docs/bins/\ncp dl/core2/mantis-core2-app.bin                  docs/bins/\n\ngit config user.name  \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A docs/bins\n\nif git diff --cached --quiet; then\n  echo \"bins unchanged - nothing to commit\"\n  exit 0\nfi\nCOUNT=$(ls -1 docs/bins/*.bin | wc -l)\ngit commit -q -m \"ci: publish ${COUNT} firmware binaries [skip ci]\"\ngit push origin \"HEAD:${BR}\"\necho \"committed ${COUNT} binaries\"\nls -l docs/bins\n"
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
  deploy-pages:
    name: Deploy to Pages
    needs: build-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
