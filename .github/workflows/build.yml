name: build

on:
  push:
    branches: [ "**" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  ESP32_CORE:    esp32:esp32@3.0.7
  LOVYANGFX_VER: 1.2.0
  RX_SKETCH:    CSI-Radar-S3
  BEACON_SKETCH: CSI-Beacon-Extended

jobs:

  # ═══════════════════════════════════════════════════════════════
  #  apply-drop — "drop a zip in the root and commit" updater
  # ═══════════════════════════════════════════════════════════════
  #  Put any *.zip in the repo root and push.  This job unpacks it
  #  OVER the working tree, commits the result, removes the zip, and
  #  hands the new commit SHA to the build jobs so they compile the
  #  updated source in the SAME run.
  #
  #  Overlay semantics, deliberately:
  #    - files in the zip overwrite files in the repo
  #    - files/folders only in the zip are added
  #    - files NOT in the zip are left completely alone
  #  Nothing is ever deleted.  A partial zip is a safe patch.
  #
  #  If there is no zip in the root this job does nothing and simply
  #  passes through the triggering SHA, so normal pushes behave
  #  exactly as they did before.
  #
  #  No infinite loop: pushes made with GITHUB_TOKEN do not trigger
  #  another workflow run.
  apply-drop:
    name: Apply dropped zip (if any)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      applied: ${{ steps.result.outputs.applied }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for a dropped zip
        id: find
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "none found"
            echo "zip=" >> "$GITHUB_OUTPUT"
          elif [ ${#zips[@]} -gt 1 ]; then
            echo "::error::More than one .zip in the repo root: ${zips[*]}"
            echo "::error::Leave exactly one so it is unambiguous which to apply."
            exit 1
          else
            echo "found: ${zips[0]}"
            echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack over the working tree
        if: steps.find.outputs.zip != ''
        run: |
          set -euo pipefail
          ZIP="${{ steps.find.outputs.zip }}"
          TMP=$(mktemp -d)
          unzip -q "$ZIP" -d "$TMP/x"

          # Zips exported from a folder usually have a single wrapper
          # directory (CSIRadar32-main/).  Use its CONTENTS, not the
          # folder itself, or everything lands one level too deep.
          SRC="$TMP/x"
          if [ "$(ls -A "$SRC" | wc -l)" -eq 1 ]; then
            only="$(ls -A "$SRC")"
            if [ -d "$SRC/$only" ]; then
              echo "unwrapping top-level folder: $only/"
              SRC="$SRC/$only"
            fi
          fi

          # Never let a zip overwrite git internals.
          rm -rf "$SRC/.git"

          # GITHUB_TOKEN CANNOT create or update files under
          # .github/workflows -- GitHub blocks it at the push, and there is
          # no `workflows` scope that can be added to the permissions block
          # to allow it.  Only a PAT with `workflow` scope can.  So the
          # overlay skips them; anything else in .github still applies.
          #
          # This is NOT silent: if the zip carries workflow changes they are
          # reported here so they can be applied by hand.  A dropped-in
          # workflow change that vanished without a word would be worse than
          # the failed push.
          if [ -d "$SRC/.github/workflows" ]; then
            if ! diff -rq "$SRC/.github/workflows" ".github/workflows" >/dev/null 2>&1; then
              echo "::warning::Zip contains workflow changes. They were NOT applied -- GITHUB_TOKEN cannot update .github/workflows. Apply that directory manually."
              echo "--- workflow differences (not applied) ---"
              diff -rq "$SRC/.github/workflows" ".github/workflows" || true
            else
              echo "workflow files identical - nothing to apply"
            fi
            rm -rf "$SRC/.github/workflows"
          fi

          echo "applying $(find "$SRC" -type f | wc -l) files"
          # -a preserves modes and copies dotfiles; trailing /. means
          # "contents of", so this overlays instead of nesting.
          cp -a "$SRC"/. .

          rm -f "$ZIP"
          echo "removed $ZIP so it does not re-apply next push"

      - name: Commit the result
        id: result
        run: |
          set -euo pipefail
          if [ -z "${{ steps.find.outputs.zip }}" ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "zip contents identical to repo; nothing to commit"
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Apply ${{ steps.find.outputs.zip }} [drop-in]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          NEW=$(git rev-parse HEAD)
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "sha=${NEW}"   >> "$GITHUB_OUTPUT"
          echo "committed ${NEW}"

      - name: Summary
        run: |
          echo "### Drop-in updater" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.result.outputs.applied }}" = "true" ]; then
            echo "Applied \`${{ steps.find.outputs.zip }}\` and committed \`${{ steps.result.outputs.sha }}\`." >> $GITHUB_STEP_SUMMARY
            echo "Build jobs below compile that commit." >> $GITHUB_STEP_SUMMARY
          else
            echo "No zip found. Normal build of \`${{ steps.result.outputs.sha }}\`." >> $GITHUB_STEP_SUMMARY
          fi
  build-receiver:
    name: Build receiver (T-Display-S3)
    needs: apply-drop
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit apply-drop produced, so a zip dropped
          # in this push is compiled in this same run.
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install ${{ env.ESP32_CORE }}
      - name: Install LovyanGFX
        run: arduino-cli lib install "LovyanGFX@${{ env.LOVYANGFX_VER }}"
      # Tactical inference is the one subsystem deliberately implemented in
      # Rust. ESP32-S3 is Xtensa, so use the Espressif Xtensa toolchain rather
      # than pretending a host Rust build is equivalent.
      # The Xtensa toolchain install is by far the slowest step in the
      # workflow and it is identical run to run.  Keyed on the Cargo
      # manifest so a crate change still rebuilds, but a source-only
      # push does not re-download a compiler.
      - name: Cache Rust toolchain and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            rust/rfcore/target
          key: xtensa-${{ runner.os }}-${{ hashFiles('rust/rfcore/Cargo.toml') }}-${{ hashFiles('rust/rfcore/src/lib.rs') }}
          restore-keys: |
            xtensa-${{ runner.os }}-${{ hashFiles('rust/rfcore/Cargo.toml') }}-
            xtensa-${{ runner.os }}-

      - name: Install Rust Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          version: 1.96.0.0
          default: true
          buildtargets: esp32s3
      - name: Verify Rust Xtensa toolchain
        run: |
          set -euo pipefail
          rustup toolchain list
          rustc +esp --version --verbose
          cargo +esp --version --verbose
          rustc +esp --print target-list | grep -Fx xtensa-esp32s3-none-elf
      - name: Build Rust RF inference core
        run: |
          set -euo pipefail
          cargo +esp build --release --target xtensa-esp32s3-none-elf --manifest-path rust/rfcore/Cargo.toml
          test -s rust/rfcore/target/xtensa-esp32s3-none-elf/release/libmantis_rfcore.a
          ar t rust/rfcore/target/xtensa-esp32s3-none-elf/release/libmantis_rfcore.a | grep -q .
      - name: Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Prep receiver sketch directory
        run: |
          if [ -f "CSI-Radar-S3.ino" ] && [ ! -d "CSI-Radar-S3" ]; then
            mkdir -p CSI-Radar-S3
            shopt -s nullglob
            for f in *.ino *.h *.cpp; do
              [ -f "$f" ] && mv "$f" CSI-Radar-S3/
            done
          fi
          ls CSI-Radar-S3/
      # T-Display-S3 is an ESP32-S3R8: QIO flash + OPI PSRAM.  That pairing
      # is the reason PSRAM init fails here.  Nearly every S3 board
      # definition assumes flash and PSRAM share a bus width -- both quad or
      # both octal -- and this board does not.  PSRAM=opi with an octal
      # flash mode fails; PSRAM=enabled (quad) with QIO flash fails.  It has
      # to be exactly PSRAM=opi + FlashMode=qio.
      #
      # FlashSize is deliberately NOT set: it regenerates the partition
      # table, the current build boots, and flash size is irrelevant to
      # PSRAM init.  Merge offsets below are fixed and use --flash_size
      # keep, so board options flow through without touching them.
      #
      # NOTHING in the firmware depends on PSRAM.  The framebuffer stays in
      # internal DRAM on purpose.  This flag exists so setup() can report
      # whether PSRAM actually initializes -- a fact, from the device,
      # instead of a guess.  A failed init logs and continues; it is not
      # fatal.
      # CDCOnBoot=cdc: belt and braces.  MS_SERIAL_LOG is 0 so the
      # firmware emits nothing on UART0 anyway, but GPIO43/44 are
      # U0TXD/U0RXD and also the peer-link pins -- if anyone ever flips
      # MS_SERIAL_LOG on for bench work, this keeps the console on USB
      # instead of letting it collide with the wire.
      - name: Compile
        run: |
          set -o pipefail
          mkdir -p build/rx
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashMode=qio,CDCOnBoot=cdc \
            --build-property "compiler.optimization_flags=-O2" \
            --build-property "compiler.cpp.extra_flags=-I${{ github.workspace }}/rust/rfcore" \
            --build-property "compiler.c.extra_flags=-I${{ github.workspace }}/rust/rfcore" \
            --build-property "compiler.c.elf.extra_flags=-L${{ github.workspace }}/rust/rfcore/target/xtensa-esp32s3-none-elf/release -Wl,--whole-archive -l:libmantis_rfcore.a -Wl,--no-whole-archive" \
            --output-dir build/rx \
            "${{ env.RX_SKETCH }}" 2>&1 | tee build/compile.log

      # ── DRAM HEADROOM ─────────────────────────────────────────────
      # The Rust inference core is ~25 KB of .bss that was never in the
      # original budget, and the LovyanGFX sprite is another ~106 KB
      # allocated from the heap at boot.  If globals crowd the heap the
      # sprite allocation fails, the UI silently falls back to
      # direct-draw, and the only symptom is tearing.
      #
      # arduino-cli prints the real figure from the link.  Read it rather
      # than estimating, and fail BEFORE flashing if the sprite could not
      # possibly fit.
      - name: Check DRAM headroom
        run: |
          set -o pipefail
          LINE=$(grep -i "Global variables use" build/compile.log | head -1 || true)
          echo "$LINE"
          USED=$(echo "$LINE" | grep -oE 'use [0-9]+' | grep -oE '[0-9]+' | head -1)
          FREE=$(echo "$LINE" | grep -oE 'leaving [0-9]+' | grep -oE '[0-9]+' | head -1)
          if [ -z "${FREE:-}" ]; then
            echo "::warning::could not parse DRAM figures - skipping headroom check"
            exit 0
          fi
          echo "globals ${USED:-?} B, ${FREE} B left for local variables"
          # The sprite alone needs 170*320*2 = 108800 B from that pool.
          if [ "$FREE" -lt 120000 ]; then
            echo "::error::Only ${FREE} B of DRAM left; the 108800 B display"
            echo "::error::sprite cannot fit. UI would fall back to direct-draw."
            exit 1
          fi
          if [ "$FREE" -lt 140000 ]; then
            echo "::warning::DRAM headroom is thin (${FREE} B). Sprite needs 108800 B."
          fi
      # ── WHICH CORE ACTUALLY LINKED? ───────────────────────────────
      # rust_rf_fallback.cpp defines every mantis_rf_* symbol WEAKLY so a
      # local Arduino build works without the Xtensa Rust toolchain.  But
      # a weak DEFINITION satisfies the linker, and the linker only
      # searches archives for UNDEFINED symbols -- so without
      # --whole-archive the fallback silently wins, libmantis_rfcore.a is
      # never opened, and the firmware runs the no-op core while
      # reporting "model not ready" forever.  That looks exactly like an
      # inference bug and is not one.
      #
      # Verified rather than assumed.  The real implementation is far
      # larger than the stub, so symbol size tells them apart.
      - name: Verify the REAL Rust core is linked
        run: |
          set -euo pipefail
          ELF="build/rx/${{ env.RX_SKETCH }}.ino.elf"
          test -f "$ELF"
          NM=$(find ~/.arduino15 -name 'xtensa-esp32s3-elf-nm' -type f | head -1)
          if [ -z "$NM" ]; then
            echo "::warning::xtensa nm not found - skipping link verification"
            exit 0
          fi
          # NOTE: no strtonum().  ubuntu-latest ships mawk as the default
          # awk and strtonum() is a GAWK extension -- it would abort this
          # step with "function strtonum never defined".  Pull the hex
          # field out with awk and convert in the shell instead.
          SZ_HEX=$("$NM" -S "$ELF" | awk '$4 == "mantis_rf_observe" { print $2; exit }')
          SZ=$((16#${SZ_HEX:-0}))
          echo "mantis_rf_observe = ${SZ} bytes (0x${SZ_HEX:-0})"
          if [ "$SZ" -lt 64 ]; then
            echo "::error::WEAK FALLBACK linked, not the Rust core."
            echo "::error::mantis_rf_observe is ${SZ} bytes - that is a stub."
            exit 1
          fi
          echo "real Rust core linked"

      - name: Merge into single .bin
        run: |
          pip install esptool
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          cd build/rx
          python -m esptool --chip esp32s3 merge_bin \
            -o csi-radar-s3-merged.bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x0     ${{ env.RX_SKETCH }}.ino.bootloader.bin \
            0x8000  ${{ env.RX_SKETCH }}.ino.partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 ${{ env.RX_SKETCH }}.ino.bin
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-merged
          path: build/rx/csi-radar-s3-merged.bin
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  #  CARDPUTER-ADV PROBE
  # ═══════════════════════════════════════════════════════════
  # ONE merged image serves every install path.  I originally built two
  # files on the assumption that M5Launcher needed a bare application
  # image and that a merged one would write a bootloader into an app
  # partition.  That assumption was wrong, and checking it mattered:
  #
  #   M5Launcher PARSES a merged factory image and extracts the
  #   application from it.  Shipping firmware for this exact board does
  #   precisely that -- "merged factory images, truncated after the
  #   application payload ... work with the browser installer, esptool at
  #   flash offset 0x0 and M5Launcher".
  #
  # The word that matters is TRUNCATED.  esptool merge_bin does not pad
  # to flash size unless --fill-flash-size is passed, and our existing
  # receiver image proves it: 1,152,496 bytes against an 8 MB flash.  A
  # padded 8 MB file would be a miserable thing to put on an SD card and
  # slow to parse.
  #
  # So: one merged bin, verified truncated and verified to carry the ESP
  # image magic.  The bare .ino.bin is ALSO published, because the
  # Launcher accepts that form too and it is a smaller download for
  # SD-only users -- but it is an alternative, not a requirement.
  build-cardputer:
    needs: apply-drop
    runs-on: ubuntu-latest
    env:
      CP_SKETCH: Mantis-Cardputer-Adv
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-drop.outputs.sha }}

      - uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 + M5Stack cores
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli config add board_manager.additional_urls \
            https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          # Vendor docs require M5Stack board manager >= 3.2.3 for the ADV.
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli core install m5stack:esp32@3.2.3

      - name: Install M5 libraries
        run: |
          set -euo pipefail
          # Minimum versions from the M5 documentation for Cardputer-Adv.
          # The battery page is the strictest and it governs: board
          # manager >= 3.2.3, M5Cardputer >= 1.1.1, M5Unified >= 0.2.10.
          # Pinning the floor rather than taking "latest" means a library
          # release cannot silently change behaviour between builds.
          arduino-cli lib install "M5Cardputer@1.1.1"
          arduino-cli lib install "M5Unified@0.2.10"
          arduino-cli lib install "M5GFX@0.2.10"
          # ESP8266Audio must be EXACTLY 1.9.7.  The working Cardputer-Adv
          # MP3 players pin this version; later releases change the
          # AudioOutput interface and the build either fails or produces
          # no sound with nothing in the log to say why.
          arduino-cli lib install "ESP8266Audio@1.9.7"
          arduino-cli lib list

      - name: Prep sketch directory
        run: |
          set -euo pipefail
          mkdir -p "${{ env.CP_SKETCH }}"
          cp cardputer/*.h cardputer/*.ino "${{ env.CP_SKETCH }}/" 2>/dev/null || true
          # The mesh and inference headers are shared with the receiver;
          # the Cardputer is a full receiver and uses all of them.
          cp mantis_*.h "${{ env.CP_SKETCH }}/"
          cp config.h csi.h scene.h "${{ env.CP_SKETCH }}/" 2>/dev/null || true
          mv "${{ env.CP_SKETCH }}/Mantis-Cardputer-Adv.ino" \
             "${{ env.CP_SKETCH }}/${{ env.CP_SKETCH }}.ino" 2>/dev/null || true
          ls -la "${{ env.CP_SKETCH }}"

      - name: Compile
        run: |
          set -o pipefail
          mkdir -p build/cardputer
          arduino-cli compile \
            --fqbn m5stack:esp32:m5stack_cardputer \
            --build-property "build.partitions=default_8MB" \
            --build-property "upload.maximum_size=3342336" \
            --output-dir build/cardputer \
            "${{ env.CP_SKETCH }}" 2>&1 | tee build/cp_compile.log

      - name: Make BOTH binaries
        run: |
          set -euo pipefail
          pip install esptool
          cd build/cardputer
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)

          # 1. MERGED -- for the web flasher, written at offset 0.
          python -m esptool --chip esp32s3 merge_bin \
            -o mantis-cardputer-adv-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0     "${{ env.CP_SKETCH }}.ino.bootloader.bin" \
            0x8000  "${{ env.CP_SKETCH }}.ino.partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "${{ env.CP_SKETCH }}.ino.bin"

          # 2. APP-ONLY -- the bare application image.
          # M5Launcher accepts this form as well (the charge-mode app for
          # this board ships exactly this way), and it is a much smaller
          # SD download.  Offered as an alternative, not a requirement.
          cp "${{ env.CP_SKETCH }}.ino.bin" mantis-cardputer-adv-app.bin

          M=$(stat -c%s mantis-cardputer-adv-merged.bin)
          A=$(stat -c%s mantis-cardputer-adv-app.bin)
          echo "merged $M B   app-only $A B"

          # TRUNCATION IS THE PROPERTY THAT MATTERS FOR THE LAUNCHER.
          # A merged image padded to the full 8 MB flash would still
          # flash correctly over USB but would be a 8 MB file to copy to
          # an SD card and to parse.  Our receiver image is 1.15 MB on an
          # 8 MB flash, so merge_bin is not padding -- assert it stays
          # that way rather than trusting it.
          if [ "$M" -gt 4194304 ]; then
            echo "::error::merged bin is ${M} B - looks padded to flash size."
            echo "::error::M5Launcher wants a TRUNCATED merged image."
            exit 1
          fi
          if [ "$A" -ge "$M" ]; then
            echo "::error::app-only bin is not smaller than merged - wrong file"
            exit 1
          fi
          # Both must carry the ESP image magic 0xE9 as their first byte.
          for f in mantis-cardputer-adv-merged.bin mantis-cardputer-adv-app.bin; do
            HDR=$(od -An -tx1 -N1 "$f" | tr -d ' \n')
            if [ "$HDR" != "e9" ]; then
              echo "::error::$f has no ESP image magic (got 0x$HDR)"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cardputer
          path: build/cardputer/mantis-cardputer-adv-*.bin

  build-beacon:
    name: Build smart beacon (${{ matrix.chip }})
    needs: apply-drop
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chip: [c3, s3]
        include:
          - chip: c3
            chip_family: esp32c3
            fqbn: esp32:esp32:XIAO_ESP32C3
          - chip: s3
            chip_family: esp32s3
            fqbn: esp32:esp32:XIAO_ESP32S3
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit apply-drop produced, so a zip dropped
          # in this push is compiled in this same run.
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install ${{ env.ESP32_CORE }}
      # Set the beacon ID the same way it was being set by hand: edit the
      # one initializer in the sketch, then compile.
      #
      # The previous approach passed -DBEACON_ID_DEFAULT as a build flag,
      # but the sketch never references that macro -- so the flag bound to
      # nothing, every per-ID build produced an identical binary, and every
      # flashed board came up as id 1 with MAC 1A:00:00:00:00:01.  Because
      # slot_for_mac() keys on the MAC, the receiver then collapsed all of
      # them into ONE beacon slot: the symptom was "recognizes them all as
      # id 1 and only connects to one at a time".
      #
      # This patches a WORKING COPY.  The committed firmware still reads
      # `= 1`, so a local Arduino build is unchanged.
      - name: Prep sketch (ONE firmware for every beacon)
        run: |
          set -euo pipefail
          # No per-device patching.  The beacon claims its id from the
          # mesh at runtime and persists it in NVS; the physical box is
          # identified permanently by a MAC-derived uid.  That removed
          # six build jobs, six artefacts and six manifests, and it
          # removed the failure mode where the wrong bin went to the
          # wrong box.
          mkdir -p BeaconBuild
          cp CSI-Beacon-Mantis/CSI-Beacon-Mantis.ino BeaconBuild/BeaconBuild.ino
          cp mantis_*.h BeaconBuild/
          ls -la BeaconBuild

      - name: Compile beacon (chip=${{ matrix.chip }})
        run: |
          mkdir -p build/beacon
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --output-dir build/beacon \
            "BeaconBuild"
      - name: Merge into single .bin
        run: |
          pip install esptool
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          cd build/beacon
          OUT="csi-beacon-${{ matrix.chip }}-merged.bin"
          python -m esptool --chip ${{ matrix.chip_family }} merge_bin \
            -o "$OUT" \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x0     ${{ env.BEACON_SKETCH }}.ino.bootloader.bin \
            0x8000  ${{ env.BEACON_SKETCH }}.ino.partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 ${{ env.BEACON_SKETCH }}.ino.bin
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.chip }}-merged
          path: build/beacon/csi-beacon-${{ matrix.chip }}-merged.bin
          retention-days: 30

  build-pages:
    name: Assemble web flasher
    needs: [apply-drop, build-receiver, build-cardputer, build-beacon]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commits the fresh bins back into docs/bins
    outputs:
      short_sha: ${{ needs.build-receiver.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the commit apply-drop produced, so a zip dropped
          # in this push is compiled in this same run.
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: receiver-merged
          path: dl/receiver
      - uses: actions/download-artifact@v4
        with:
          name: cardputer
          path: dl/cardputer
      - uses: actions/download-artifact@v4
        with:
          pattern: beacon-*-merged
          path: dl/beacons
          merge-multiple: true
      - name: Write QR generator script
        run: |
          mkdir -p .ci
          cat > .ci/make_qr.py <<'PYEOF'
          import qrcode, qrcode.image.svg, sys
          url = sys.argv[1]
          out = sys.argv[2]
          qr = qrcode.QRCode(
              version=None,
              error_correction=qrcode.constants.ERROR_CORRECT_M,
              box_size=10, border=4,
          )
          qr.add_data(url)
          qr.make(fit=True)
          img = qr.make_image(
              image_factory=qrcode.image.svg.SvgPathImage,
              fill_color="#050510", back_color="#ffffff",
          )
          img.save(out)
          PYEOF
      - name: Assemble site
        run: |
          set -e
          mkdir -p site
          cp -r docs/. site/
          # docs/bins is intentionally NOT in the repo: binaries are build
          # artifacts, and committed copies were stale ones from the build
          # that never applied the beacon ID.  This directory is created
          # here and filled from the artifacts below.
          mkdir -p site/bins
          cp dl/receiver/csi-radar-s3-merged.bin site/bins/
          cp dl/beacons/csi-beacon-*-merged.bin site/bins/
          python3 -m pip install --quiet 'qrcode[pil]'
          python3 .ci/make_qr.py "https://5t31thphoto.github.io/CSIRadar32/" site/qr.svg
          SHORT_SHA="${{ needs.build-receiver.outputs.short_sha }}"
          BUILD_DATE=$(date -u +%Y-%m-%d)
          # The templated page is flash.html.  It USED to be index.html,
          # and when it was renamed these two lines were not updated, so
          # every build has been substituting a file with no tokens in it
          # while the flasher footer renders the literal {{SHORT_SHA}}.
          # Substitute both, so it keeps working if tokens are ever added
          # to the landing page too.
          for page in site/flash.html site/index.html; do
            sed -i "s|{{SHORT_SHA}}|${SHORT_SHA}|g" "$page"
            sed -i "s|{{BUILD_DATE}}|${BUILD_DATE}|g" "$page"
          done
          touch site/.nojekyll
      # Publish the freshly built binaries back into docs/bins so the repo
      # always carries flashable firmware that MATCHES its source.  The
      # deployed site already gets them via site/bins; this makes opening
      # docs/flash.html straight off a local clone work too.
      #
      # Only on the default branch, and only when the bytes actually
      # changed -- a source-only push rebuilds byte-identical binaries and
      # produces no commit, so history does not grow for nothing.  Each
      # real firmware change is ~13 MB across 13 binaries.
      #
      # Pushes made with GITHUB_TOKEN do not trigger another workflow run,
      # so this cannot loop.
      - name: Commit fresh bins into docs/bins
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME}"
          git fetch --depth=1 origin "$BR"
          git checkout -B "$BR" "origin/$BR"

          mkdir -p docs/bins
          cp dl/receiver/csi-radar-s3-merged.bin docs/bins/
          cp dl/beacons/csi-beacon-*-merged.bin  docs/bins/
          # BOTH Cardputer artefacts.  The MERGED image is the one to
          # reach for: it works with the web flasher, with esptool at
          # 0x0, AND with M5Launcher, which extracts the application from
          # it.  The app-only bin is a smaller alternative for SD users.
          cp dl/cardputer/mantis-cardputer-adv-merged.bin   docs/bins/ || true
          cp dl/cardputer/mantis-cardputer-adv-app.bin      docs/bins/ || true

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/bins

          if git diff --cached --quiet; then
            echo "bins unchanged - nothing to commit"
            exit 0
          fi
          COUNT=$(ls -1 docs/bins/*.bin | wc -l)
          git commit -q -m "ci: publish ${COUNT} firmware binaries [skip ci]"
          git push origin "HEAD:${BR}"
          echo "committed ${COUNT} binaries"
          ls -l docs/bins

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy to Pages
    needs: build-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
