# ═══════════════════════════════════════════════════════════════
#  MantisSec CSI Radar -- build every firmware and publish the flasher
# ═══════════════════════════════════════════════════════════════
#  Hand-written.  The previous copy had been round-tripped through a YAML
#  serialiser that turned the `on:` key into `true:` (YAML 1.1 reads a
#  bare `on` as a boolean).  Do not re-serialise this file.
#
#  Jobs:
#    apply-drop      unpack a dropped zip over the tree and commit it
#    preflight       compile every firmware + run the mesh simulation
#    build-receiver  T-Display-S3 anchor (Rust RF core + C++)
#    build-cardputer Cardputer ADV probe
#    build-core2     Core2 probe
#    build-beacon    smart mesh beacon, C3 and S3
#    build-pages     assemble the web flasher, commit fresh bins
#    deploy-pages    publish (main only)
#
#  RULE: COMPILED FIRMWARE ALWAYS REACHES THE FLASHER.
#  Only a firmware that genuinely fails to compile is missing, and it
#  never stops the others.  Every check is a WARNING; a target that
#  failed keeps its previous binary on the flasher.  The anchor ALWAYS
#  links the Rust RF core, as a precompiled Arduino library.
# ═══════════════════════════════════════════════════════════════
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  ESP32_CORE: esp32:esp32@3.0.7
  LOVYANGFX_VER: "1.2.0"
  M5UNIFIED_VER: "0.2.10"
  M5GFX_VER: "0.2.10"
  M5CARDPUTER_VER: "1.1.1"
  ESP8266AUDIO_VER: "1.9.7"
  ESPTOOL_VER: "4.8.1"
  QRCODE_VER: "7.4.2"
  # The m5stack core that is PROVEN to compile the Cardputer ADV firmware
  # (CI, 3.3.9).  Pinned: "latest" changes under you.
  M5STACK_CORE_VER: "3.3.9"
  # Rust Xtensa toolchain installed by espup.
  ESP_RUST_VER: "1.96.0.0"
  # cargo's own network retry, for -Z build-std fetching from crates.io.
  CARGO_NET_RETRY: "10"
  RX_SKETCH: CSI-Radar-S3

jobs:
  # ─────────────────────────────────────────────────────────────
  apply-drop:
    name: Apply dropped zip (if any)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.result.outputs.sha }}
      applied: ${{ steps.result.outputs.applied }}
      zip: ${{ steps.find.outputs.zip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for a dropped zip
        id: find
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "none found"
            echo "zip=" >> "$GITHUB_OUTPUT"
          elif [ ${#zips[@]} -gt 1 ]; then
            echo "::warning::More than one .zip in the repo root: ${zips[*]} -- applying the last one"
            echo "zip=${zips[-1]}" >> "$GITHUB_OUTPUT"
          else
            echo "found: ${zips[0]}"
            echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack over the working tree
        if: steps.find.outputs.zip != ''
        run: |
          set -euo pipefail
          ZIP="${{ steps.find.outputs.zip }}"
          TMP=$(mktemp -d)
          unzip -q "$ZIP" -d "$TMP/x"
          SRC="$TMP/x"
          if [ "$(ls -A "$SRC" | wc -l)" -eq 1 ]; then
            only="$(ls -A "$SRC")"
            [ -d "$SRC/$only" ] && { echo "unwrapping $only/"; SRC="$SRC/$only"; }
          fi
          rm -rf "$SRC/.git"
          # GITHUB_TOKEN cannot write .github/workflows, so a dotted
          # workflow dir in a drop is reported and skipped.  The UNDOTTED
          # github/workflows form is applied like any other file on
          # purpose: that is the hand-off, renamed to .github by a human.
          for wf in "$SRC/.github/workflows"; do
            if [ -d "$wf" ]; then
              echo "::warning::Drop contains workflow files ($wf). Not applied -- copy them to .github/workflows by hand."
              diff -rq "$wf" .github/workflows || true
              rm -rf "$wf"
            fi
          done
          echo "applying $(find "$SRC" -type f | wc -l) files"
          cp -a "$SRC"/. .
          # RETIRED FILES.  A drop can only add or overwrite; it cannot
          # delete.  tools/retired.txt lists paths that must go.
          if [ -f tools/retired.txt ]; then
            while IFS= read -r p; do
              p="${p%%#*}"; p="$(echo "$p" | xargs)"
              [ -z "$p" ] && continue
              for f in $p; do
                if [ -e "$f" ]; then git rm -rq --ignore-unmatch "$f" || rm -rf "$f"; echo "retired $f"; fi
              done
            done < tools/retired.txt
          fi
          rm -f "$ZIP"

      - name: Commit the result
        id: result
        run: |
          set -euo pipefail
          if [ -z "${{ steps.find.outputs.zip }}" ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Apply ${{ steps.find.outputs.zip }} [drop-in]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  preflight:
    name: Pre-flight (advisory - never blocks a build)
    needs: apply-drop
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-drop.outputs.sha }}
      - name: Compile every firmware as Arduino builds it + mesh simulation
        run: |
          set -euo pipefail
          chmod +x tools/*.sh
          ./tools/preflight.sh

  # ─────────────────────────────────────────────────────────────
  build-receiver:
    name: Build anchor (T-Display-S3)
    needs: [apply-drop]
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          set -euo pipefail
          source tools/ci_retry.sh
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          retry arduino-cli core update-index
          retry arduino-cli core install "${{ env.ESP32_CORE }}"

      - name: Install LovyanGFX
        run: |
          source tools/ci_retry.sh
          retry arduino-cli lib install "LovyanGFX@${{ env.LOVYANGFX_VER }}"

      - name: Install Rust Xtensa toolchain (espup)
        # espup queries the GitHub API for the toolchain release.  It needs a
        # REAL token: an empty GITHUB_TOKEN is still sent as an auth header
        # and GitHub answers 401 -- which is exactly how this step failed.
        # secrets.GITHUB_TOKEN is the job's own token; it is valid for the
        # public API and lifts the anonymous 60-requests/hour limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source tools/ci_retry.sh
          mkdir -p "$HOME/.cargo/bin"
          retry curl -fsSL -o "$HOME/.cargo/bin/espup" \
            https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu
          chmod +x "$HOME/.cargo/bin/espup"
          "$HOME/.cargo/bin/espup" --version
          # A half-finished install must not poison the retry.
          install_esp() {
            "$HOME/.cargo/bin/espup" install \
              --toolchain-version "${{ env.ESP_RUST_VER }}" \
              --targets esp32s3 \
              --export-file "$HOME/export-esp.sh" && return 0
            "$HOME/.cargo/bin/espup" uninstall >/dev/null 2>&1 || true
            return 1
          }
          retry install_esp
          rustup toolchain list

      - name: Verify Rust Xtensa toolchain
        run: |
          set -euo pipefail
          rustc +esp --version --verbose
          cargo +esp --version
          rustc +esp --print target-list | grep -Fx xtensa-esp32s3-none-elf
          # Xtensa targets never ship a prebuilt core library; it is built
          # from source with -Z build-std.  What MUST exist is rust-src.
          SYSROOT=$(rustc +esp --print sysroot)
          test -d "$SYSROOT/lib/rustlib/src/rust/library/core" \
            || { echo "::error::rust-src missing from the esp toolchain ($SYSROOT)"; exit 1; }
          echo "rust-src present: core will be built from source"

      - name: Build Rust RF inference core
        run: |
          set -euo pipefail
          [ -f "$HOME/export-esp.sh" ] && source "$HOME/export-esp.sh"
          cargo +esp build --release \
            --target xtensa-esp32s3-none-elf \
            -Z build-std=core \
            --manifest-path rust/rfcore/Cargo.toml
          LIB=rust/rfcore/target/xtensa-esp32s3-none-elf/release/libmantis_rfcore.a
          test -s "$LIB"
          echo "archive members: $(ar t "$LIB" | wc -l)"

      - name: Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prep sketch directory
        run: |
          set -euo pipefail
          mkdir -p "${{ env.RX_SKETCH }}"
          cp CSI-Radar-S3.ino *.h *.cpp "${{ env.RX_SKETCH }}/"
          # rfcore.h belongs to the MantisRfCore library below, not the
          # sketch: arduino-cli finds that library BY this header.
          rm -f "${{ env.RX_SKETCH }}/rfcore.h" "${{ env.RX_SKETCH }}/rust_rf_fallback.cpp"
          ls "${{ env.RX_SKETCH }}"

      - name: Assemble the MantisRfCore Arduino library
        # Arduino's documented precompiled-library mechanism:
        #   library.properties: precompiled=true, ldflags=-lmantis_rfcore
        #   archive at src/<build.mcu>/  (esp32s3)
        # arduino-cli then links it inside the platform's own link group.
        # No build-property overrides, so the platform's linker-script
        # paths are never touched.
        run: |
          set -euo pipefail
          LIBDIR="$GITHUB_WORKSPACE/build/libs/MantisRfCore"
          mkdir -p "$LIBDIR/src/esp32s3"
          cp rust/rfcore/arduino/MantisRfCore/library.properties "$LIBDIR/"
          cp rust/rfcore/rfcore.h "$LIBDIR/src/"
          cp rust/rfcore/target/xtensa-esp32s3-none-elf/release/libmantis_rfcore.a "$LIBDIR/src/esp32s3/"
          find "$LIBDIR" -type f | sort

      - name: Compile
        run: |
          set -o pipefail
          mkdir -p build/rx
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashMode=qio,CDCOnBoot=cdc" \
            --build-property "compiler.optimization_flags=-O2" \
            --library "$GITHUB_WORKSPACE/build/libs/MantisRfCore" \
            --output-dir build/rx \
            "./${{ env.RX_SKETCH }}" 2>&1 | tee build/compile.log

      - name: Check DRAM headroom (advisory)
        continue-on-error: true
        run: |
          LINE=$(grep -i "Global variables use" build/compile.log | head -1 || true)
          echo "$LINE"
          FREE=$(echo "$LINE" | grep -oE 'leaving [0-9]+' | grep -oE '[0-9]+' | head -1)
          if [ -z "${FREE:-}" ]; then echo "::warning::could not parse DRAM figures"; exit 0; fi
          if [ "$FREE" -lt 120000 ]; then
            echo "::warning::Only ${FREE} B of DRAM left; the 108800 B display sprite may not fit."
          fi

      - name: Report which inference core is linked (advisory)
        continue-on-error: true
        run: |
          set -euo pipefail
          ELF="build/rx/${{ env.RX_SKETCH }}.ino.elf"
          test -f "$ELF"
          NM=$(find ~/.arduino15 -name xtensa-esp32s3-elf-nm -type f -print -quit 2>/dev/null)
          [ -z "$NM" ] && NM=$(command -v nm || true)
          if [ -z "$NM" ]; then echo "::warning::no nm; cannot verify"; exit 0; fi
          SZ_HEX=$("$NM" -S "$ELF" | awk '$4 == "mantis_rf_observe" { print $2; exit }')
          SZ=$((16#${SZ_HEX:-0}))
          echo "mantis_rf_observe = ${SZ} bytes"
          if [ "$SZ" -lt 64 ]; then
            echo "::warning::mantis_rf_observe looks too small for the Rust core"
          fi

      - name: Merge into single .bin
        continue-on-error: true
        run: |
          set -euo pipefail
          pip install --retries 5 "esptool==${{ env.ESPTOOL_VER }}"
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin -print -quit)
          cd build/rx
          python -m esptool --chip esp32s3 merge_bin -o csi-radar-s3-merged.bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x0 "${{ env.RX_SKETCH }}.ino.bootloader.bin" \
            0x8000 "${{ env.RX_SKETCH }}.ino.partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "${{ env.RX_SKETCH }}.ino.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: receiver-merged
          path: build/rx/csi-radar-s3-merged.bin
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  build-cardputer:
    name: Build Cardputer ADV probe
    needs: [apply-drop]
    runs-on: ubuntu-latest
    env:
      CP_SKETCH: Mantis-Cardputer-Adv
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: arduino/setup-arduino-cli@v2

      - name: Install M5Stack core
        run: |
          set -euo pipefail
          source tools/ci_retry.sh
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
          retry arduino-cli core update-index
          # The pinned version first.  If the vendor ever pulls it from the
          # index, fall back to latest -- but SAY so, because that build is
          # no longer the one that was proven.
          if ! RETRY_MAX=2 retry arduino-cli core install "m5stack:esp32@${{ env.M5STACK_CORE_VER }}"; then
            echo "::warning::m5stack:esp32@${{ env.M5STACK_CORE_VER }} unavailable; using latest"
            retry arduino-cli core install m5stack:esp32
          fi
          VER=$(arduino-cli core list | awk '/m5stack:esp32/{print $2}')
          echo "m5stack core $VER"
          MAJOR=${VER%%.*}; REST=${VER#*.}; MINOR=${REST%%.*}
          if [ "$MAJOR" -lt 3 ] || { [ "$MAJOR" -eq 3 ] && [ "$MINOR" -lt 2 ]; }; then
            echo "::warning::m5stack core $VER is older than the 3.2.3 the Cardputer ADV docs ask for"
          fi

      - name: Install libraries (pinned, no dependency drift)
        run: |
          set -euo pipefail
          source tools/ci_retry.sh
          retry arduino-cli lib install --no-deps "M5Cardputer@${{ env.M5CARDPUTER_VER }}"
          retry arduino-cli lib install --no-deps "M5Unified@${{ env.M5UNIFIED_VER }}"
          retry arduino-cli lib install --no-deps "M5GFX@${{ env.M5GFX_VER }}"
          retry arduino-cli lib install --no-deps "ESP8266Audio@${{ env.ESP8266AUDIO_VER }}"
          bash tools/ci_prune_esp8266audio.sh
          arduino-cli lib list

      - name: Prep sketch directory
        run: |
          set -euo pipefail
          mkdir -p "$CP_SKETCH"
          cp cardputer/*.h mantis_*.h "$CP_SKETCH/"
          cp cardputer/Mantis-Cardputer-Adv.ino "$CP_SKETCH/$CP_SKETCH.ino"
          ls -la "$CP_SKETCH"

      - name: Board definition
        id: board
        # The FQBN CI has PROVEN compiles this sketch.  No auto-detection:
        # guessing a board from the list could swap in a definition nobody
        # has built against.
        run: echo "fqbn=m5stack:esp32:m5stack_cardputer" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: |
          set -o pipefail
          mkdir -p build/cardputer
          arduino-cli compile --fqbn "${{ steps.board.outputs.fqbn }}" \
            --output-dir build/cardputer "./$CP_SKETCH" 2>&1 | tee build/cp_compile.log

      - name: Make merged + app binaries
        continue-on-error: true
        run: |
          set -euo pipefail
          pip install --retries 5 "esptool==${{ env.ESPTOOL_VER }}"
          cd build/cardputer
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin -print -quit)
          python -m esptool --chip esp32s3 merge_bin -o mantis-cardputer-adv-merged.bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x0 "$CP_SKETCH.ino.bootloader.bin" \
            0x8000 "$CP_SKETCH.ino.partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$CP_SKETCH.ino.bin"
          cp "$CP_SKETCH.ino.bin" mantis-cardputer-adv-app.bin
          for f in mantis-cardputer-adv-merged.bin mantis-cardputer-adv-app.bin; do
            [ "$(od -An -tx1 -N1 "$f" | tr -d ' \n')" = "e9" ] || echo "::warning::$f lacks ESP image magic"
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: cardputer
          path: build/cardputer/mantis-cardputer-adv-*.bin

  # ─────────────────────────────────────────────────────────────
  build-core2:
    name: Build Core2 probe
    needs: [apply-drop]
    runs-on: ubuntu-latest
    env:
      C2_SKETCH: Core2Build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          set -euo pipefail
          source tools/ci_retry.sh
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          retry arduino-cli core update-index
          retry arduino-cli core install "${{ env.ESP32_CORE }}"

      - name: Install libraries (pinned)
        run: |
          set -euo pipefail
          source tools/ci_retry.sh
          retry arduino-cli lib install --no-deps "M5Unified@${{ env.M5UNIFIED_VER }}"
          retry arduino-cli lib install --no-deps "M5GFX@${{ env.M5GFX_VER }}"
          retry arduino-cli lib install --no-deps "ESP8266Audio@${{ env.ESP8266AUDIO_VER }}"
          bash tools/ci_prune_esp8266audio.sh

      - name: Prep sketch
        run: |
          set -euo pipefail
          mkdir -p "$C2_SKETCH"
          cp core2/Mantis-Core2.ino "$C2_SKETCH/$C2_SKETCH.ino"
          cp core2/*.h mantis_*.h "$C2_SKETCH/"
          ls -la "$C2_SKETCH"

      - name: Compile
        run: |
          set -o pipefail
          mkdir -p build/core2
          # The sketch PATH is explicit and first-class.  The failing run
          # compiled the repo root ("main file missing from sketch:
          # .../CSIRadar32.ino") because the path never reached the CLI.
          arduino-cli compile --fqbn esp32:esp32:m5stack_core2 \
            --output-dir build/core2 "./$C2_SKETCH" 2>&1 | tee build/core2_compile.log

      - name: Package binaries
        continue-on-error: true
        run: |
          set -euo pipefail
          pip install --retries 5 "esptool==${{ env.ESPTOOL_VER }}"
          cd build/core2
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin -print -quit)
          python -m esptool --chip esp32 merge_bin -o mantis-core2-merged.bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x1000 "$C2_SKETCH.ino.bootloader.bin" \
            0x8000 "$C2_SKETCH.ino.partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$C2_SKETCH.ino.bin"
          cp "$C2_SKETCH.ino.bin" mantis-core2-app.bin
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: core2
          path: build/core2/mantis-core2-*.bin

  # ─────────────────────────────────────────────────────────────
  build-beacon:
    name: Build smart beacon (${{ matrix.chip }})
    needs: [apply-drop]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: c3
            chip_family: esp32c3
            fqbn: esp32:esp32:XIAO_ESP32C3
          - chip: s3
            chip_family: esp32s3
            fqbn: esp32:esp32:XIAO_ESP32S3
    env:
      BN_SKETCH: BeaconBuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          set -euo pipefail
          source tools/ci_retry.sh
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          retry arduino-cli core update-index
          retry arduino-cli core install "${{ env.ESP32_CORE }}"

      - name: Prep sketch (one firmware for every beacon)
        run: |
          set -euo pipefail
          mkdir -p "$BN_SKETCH"
          cp CSI-Beacon-Mantis/CSI-Beacon-Mantis.ino "$BN_SKETCH/$BN_SKETCH.ino"
          cp mantis_*.h "$BN_SKETCH/"

      - name: Compile
        run: |
          set -o pipefail
          mkdir -p build/beacon
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" \
            --output-dir build/beacon "./$BN_SKETCH" 2>&1 | tee build/beacon_compile.log

      - name: Merge into single .bin
        continue-on-error: true
        run: |
          set -euo pipefail
          pip install --retries 5 "esptool==${{ env.ESPTOOL_VER }}"
          cd build/beacon
          BOOT_APP0=$(find ~/.arduino15 -name boot_app0.bin -print -quit)
          # Output names follow the SKETCH DIRECTORY (BeaconBuild), which
          # is what the previous version got wrong.
          python -m esptool --chip "${{ matrix.chip_family }}" merge_bin \
            -o "csi-beacon-${{ matrix.chip }}-merged.bin" \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x0 "$BN_SKETCH.ino.bootloader.bin" \
            0x8000 "$BN_SKETCH.ino.partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BN_SKETCH.ino.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.chip }}-merged
          path: build/beacon/csi-beacon-${{ matrix.chip }}-merged.bin
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  build-pages:
    name: Assemble web flasher
    needs: [apply-drop, build-receiver, build-cardputer, build-core2, build-beacon]
    # Runs even if some firmware failed: whatever DID build is published,
    # and a failed target keeps its previous binary on the flasher.
    if: always() && needs.apply-drop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-drop.outputs.sha }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: receiver-merged, path: dl/receiver }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: cardputer, path: dl/cardputer }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: core2, path: dl/core2 }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: beacon-*-merged, path: dl/beacons, merge-multiple: true }

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r docs/. site/
          mkdir -p site/bins dl
          # Start from the binaries already published, then overlay what
          # this run built.  A target that failed keeps its last good bin.
          shopt -s nullglob
          fresh=(dl/*/*.bin)
          echo "fresh binaries: ${#fresh[@]}"
          for f in "${fresh[@]}"; do cp "$f" site/bins/; done
          python3 -m pip install --quiet --retries 5 "qrcode[pil]==${{ env.QRCODE_VER }}"
          python3 - <<'PY'
          import qrcode, qrcode.image.svg
          img = qrcode.make("https://5t31thphoto.github.io/CSIRadar32/",
                            image_factory=qrcode.image.svg.SvgPathImage)
          img.save("site/qr.svg")
          PY
          SHORT_SHA="${{ needs.build-receiver.outputs.short_sha }}"
          BUILD_DATE=$(date -u +%Y-%m-%d)
          for page in site/flash.html site/index.html; do
            sed -i "s|{{SHORT_SHA}}|${SHORT_SHA}|g; s|{{BUILD_DATE}}|${BUILD_DATE}|g" "$page"
          done
          # Every manifest must point at a bin that exists.
          for m in site/manifests/*.json; do
            for p in $(grep -oE '"path"[^"]*"[^"]+"' "$m" | sed -E 's/.*"([^"]+)"$/\1/'); do
              f="site/manifests/$p"
              [ -f "$f" ] || echo "::warning::$m points at $p, which is not available yet"
            done
          done
          touch site/.nojekyll
          ls -l site/bins

      - name: Commit fresh bins into docs/bins
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # Bookkeeping only.  If the branch moved under us, the flasher
        # still publishes this run's firmware below.
        continue-on-error: true
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME}"
          git fetch --depth=1 origin "$BR"
          git checkout -B "$BR" "origin/$BR"
          mkdir -p docs/bins
          # Overwrite with the binaries this run built; never delete one
          # it did not rebuild.
          shopt -s nullglob
          for f in dl/*/*.bin; do cp "$f" docs/bins/; done
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/bins
          if git diff --cached --quiet; then echo "bins unchanged"; exit 0; fi
          git commit -q -m "ci: publish $(ls docs/bins/*.bin | wc -l) firmware binaries [skip ci]"
          git push origin "HEAD:${BR}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy to Pages
    needs: build-pages
    if: always() && needs.build-pages.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
